function send(m){if(NET.conn&&NET.conn.open){try{NET.conn.send({t:'msg',m})}catch(e){}}}
function netMsg(h){const n=$('#net');n.innerHTML=h;n.classList.remove('hide')}
function phoneNet(){
  if(!ROOM){netMsg(`<div style="font-size:50px">🕵️</div><b style="font-size:22px">Couch-Krimi</b><div>Raumcode vom Fernseher:</div><input class="in" id="roomIn" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE"><button class="btn" id="roomGo" style="max-width:220px">Beitreten</button>`);
    const go=()=>{const v=$('#roomIn').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length===4)location.href=BASE+'?r='+v};
    $('#roomGo').onclick=go;$('#roomIn').onkeydown=e=>{if(e.key==='Enter')go()};return}
  // Kennung pro Browser-Tab: übersteht Neuladen, zwei Tabs sind zwei Ermittler
  try{NET.cid=sessionStorage.getItem('ck_cid')||'';if(!NET.cid){NET.cid=Math.random().toString(36).slice(2)+now().toString(36);sessionStorage.setItem('ck_cid',NET.cid)}}catch(e){NET.cid=Math.random().toString(36).slice(2)}
  netMsg(`<div style="font-size:50px">🕵️</div><div>Verbinde mit Raum</div><b style="font-size:26px">${ROOM}</b>`);
  const mk=()=>{const peer=NET.peer=new Peer();peer.on('open',dial);peer.on('error',e=>{if(e.type==='peer-unavailable'&&ME==null)netMsg(`<div style="font-size:50px">🔍</div><div>Raum <b>${ROOM}</b> nicht gefunden.<br>Läuft der Krimi am Fernseher?<br>Ich versuche es weiter …</div>`)})};
  mk();
  setInterval(()=>{const p=NET.peer;if(!p||p.destroyed)mk();else if(p.disconnected){try{p.reconnect()}catch(e){}}else if((!NET.conn||!NET.conn.open)&&now()-NET.dialAt>4000)dial()},1500);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!NET.conn||!NET.conn.open))dial()})}
function dial(){const peer=NET.peer;if(!peer||!peer.open)return;NET.dialAt=now();if(NET.conn){try{NET.conn.close()}catch(e){}}
  const conn=NET.conn=peer.connect(peerId(ROOM),{reliable:true,serialization:'json'});
  conn.on('open',()=>{try{conn.send({t:'hello',cid:NET.cid})}catch(e){}});
  if(!dial.hb)dial.hb=setInterval(()=>{const c=NET.conn;if(c&&c.open){try{c.send({t:'hb'})}catch(e){}}},5000);
  conn.on('data',d=>{if(!d||NET.conn!==conn)return;
    if(d.t==='welcome'){ME=d.pid;$('#net').classList.add('hide');if(ph.name&&ST===null)setTimeout(()=>{if(ST&&!ST.players.some(p=>p.id===ME))send({type:'join',name:ph.name})},300)}
    else if(d.t==='full')netMsg('<div style="font-size:50px">🚪</div><div>Der Raum ist voll (höchstens 6).</div>');
    else if(d.t==='state'){const first=!ST;ST=d.s;if(ST.evs)ST.evs.forEach(e=>{if(EVC[e.id]&&e.typ==='audio'&&e.heard&&!EVC[e.id].zeilen)delete EVC[e.id];
        if(EVC[e.id]&&e.typ==='raetsel'&&((e.cracked&&!EVC[e.id].cracked)||(e.rh&&!e.cracked&&!EVC[e.id].hinweis)))delete EVC[e.id]});
      if(first&&ph.name&&!ST.players.some(p=>p.id===ME))send({type:'join',name:ph.name});renderPhone()}
    else if(d.t==='ev'){EVC[d.ev.id]=d.ev;renderPhone()}
    else if(d.t==='img'){const b=IMGPART[d.id]||(IMGPART[d.id]=[]);b[d.i]=d.d;if(b.filter(Boolean).length===d.n){IMGC[d.id]=b.join('');delete IMGPART[d.id];renderPhone()}}});
  conn.on('close',()=>{if(NET.conn===conn){NET.conn=null;netMsg('<div style="font-size:50px">📡</div><div>Verbindung verloren –<br>verbinde neu …</div>')}})}

function renderPhone(){
  const root=$('#ph');if(!ST||ME==null)return;
  const sy=scrollY,joined=ST.players.some(p=>p.id===ME),isHost=ST.hostId===ME,s=ST;
  // Eingaben nicht überschreiben, während jemand tippt
  const ae=document.activeElement;if(ae&&root.contains(ae)&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT'))return;
  let h='';
  if(!joined){h=`<div class="pbody"><div class="center"><div class="big">🕵️</div><h2 style="color:var(--txt);margin:8px 0">Couch-Krimi</h2>Wie heißt du, Ermittler?</div>
    <input class="in" id="nm" maxlength="16" placeholder="Dein Name" value="${esc(ph.name)}"><button class="btn" data-a="join">Beitreten</button></div>`;
    root.innerHTML=h;return}
  const top=`<div class="ptop"><span class="t">${s.case?'🗂️ '+esc(s.case.titel):'🕵️ Couch-Krimi'}</span>${['play','accuse'].includes(s.phase)?`<span class="tm" id="ptm">${fmtT(s.elapsed)}</span>`:''}${joined&&!isHost?`<button class="claim ${ph.confirm==='claim'?'on':''}" data-a="claim">${ph.confirm==='claim'?'Sicher? Tippen':'👑 Spielleiter werden'}</button>`:''}</div>`;
  if(['lobby','gen','ready'].includes(s.phase)){
    if(!isHost){h=`<div class="pbody"><div class="center"><div class="big">${s.phase==='lobby'?'⏳':'📝'}</div>${s.phase==='lobby'?'Warte, bis der Gastgeber einen Fall erstellt …':s.phase==='gen'?'Die KI schreibt gerade euren Fall …':'Der Fall ist bereit – gleich geht es los!'}</div>${genList(s)}</div>`}
    else if(s.phase==='lobby'){const wish=ph.wish!=null?ph.wish:s.wish;
      h=`<div class="pbody"><h2 style="margin:4px 0 2px">Neuer Fall 👑</h2><div class="note" style="margin-top:0">Beschreibe den Fall in ein paar Worten.</div>
        <label class="l">Fall-Idee</label><textarea class="in" id="wish" rows="3" maxlength="200" placeholder="z. B. Mord auf Gran Canaria">${esc(wish)}</textarea>
        <div class="chips">${['Mord auf Gran Canaria','Skandal in Stuttgart','Giftmord auf dem Weingut','Einbruch im Museum','Tod bei der Hochzeit','Erpressung im Fußballverein'].map(c=>`<button class="chip" data-a="chip" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
        <label class="l">Spieldauer</label><div class="chips">${[45,60,90].map(m=>`<button class="chip ${s.min===m?'on':''}" data-a="min" data-v="${m}">ca. ${m} Min.</button>`).join('')}</div>
        <label class="l">Schwierigkeit</label><div class="chips">${['leicht','normal','schwer'].map(l=>`<button class="chip ${s.level===l?'on':''}" data-a="lvl" data-v="${l}">${l[0].toUpperCase()+l.slice(1)}</button>`).join('')}</div>
        <button class="btn" data-a="create" ${s.keyOk?'':'disabled'}>🔎 Fall erstellen</button>
        ${s.keyOk?'<div class="note">Die KI braucht für Kapitel 1 ein paar Minuten, den Rest schreibt sie, während ihr ermittelt.</div>':'<div class="note bad">Zuerst unten einen Gemini-Key eintragen.</div>'}
        <label class="l">Gemini-API-Key</label><input class="in" id="key" type="password" autocomplete="off" placeholder="${s.keyOk?'gespeichert – neuen eintragen zum Ändern':'AIza…'}">
        <button class="btn sec small" data-a="key">Key speichern</button>${s.keyMsg?`<div class="note ${s.keyMsg.ok?'ok':s.keyMsg.ok===false?'bad':''}">${esc(s.keyMsg.t)}</div>`:''}
        <div class="note">Kostenlos bei aistudio.google.com. Der Key wird nur auf dem Fernseher gespeichert.</div></div>`}
    else{h=`<div class="pbody"><h2 style="margin:4px 0 8px">${s.case?esc(s.case.titel):'Fall wird erstellt'}</h2>${genList(s)}
      ${s.phase==='ready'?`<button class="btn" data-a="begin">🚨 Ermittlung starten</button>`:''}
      ${s.gen.err&&!s.gen.busy?`<div class="note bad">${esc(s.gen.err)}</div><button class="btn" data-a="retry">Erneut versuchen</button>`:''}
      <button class="btn sec small" data-a="discard" style="margin-top:24px">${ph.confirm==='discard'?'Wirklich verwerfen?':'Fall verwerfen'}</button></div>`}
    root.innerHTML=top+h;return}
  if(s.phase==='briefing'){h=`<div class="pbody"><div class="center"><div class="big">🚨</div><h2 style="color:var(--txt)">Einsatzbefehl</h2></div><div class="doc" style="font-size:15px">${esc(s.case.einleitung)}</div>
    ${isHost?`<button class="btn" data-a="toFile">Zur Fallakte</button><button class="btn sec small" data-a="discard" style="margin-top:28px">${ph.confirm==='discard'?'Wirklich beenden? Der Fall wird gelöscht.':'🏁 Fall beenden'}</button>`:'<div class="note">Hört zu – gleich geht es los.</div>'}</div>`;root.innerHTML=top+h;return}
  if(s.phase==='end'){const r=s.result,pk=s.case.personen.find(p=>p.id===r.pick.taeter)||{},tt=s.case.personen.find(p=>p.id===r.taeter)||{};
    h=`<div class="pbody"><div class="center"><div class="big">${r.taeter?'🏆':'🕳️'}</div><h2 style="color:var(--txt);margin:6px 0">${r.taeter?'Fall gelöst!':'Der Täter entkommt …'}</h2><div style="font-size:40px;color:var(--amber);font-weight:800">${r.score} / 100</div></div>
      <div class="note">${r.taeter?`Ihr habt ${esc(pk.name)} überführt.`:`Ihr habt auf ${esc(pk.name)} getippt – es war ${esc(tt.name)}.`} Zeit: ${fmtT(r.elapsed)}</div>
      <div class="doc" style="font-size:15px;margin-top:14px">${esc(r.ablauf)}</div>
      <button class="btn sec" data-a="playSol">🔊 Auflösung am TV abspielen</button>${isHost?`<button class="btn" data-a="newGame">Neuer Fall</button>`:''}</div>`;root.innerHTML=top+h;return}
  // Ermittlung: Akte / Personen / Auftrag
  const newEv=s.evs.filter(e=>!ph.seen.has(e.id)).length;
  if(OPEN&&!s.evs.some(e=>e.id===OPEN))OPEN=null;
  if(TAB==='akte'&&OPEN){const meta=s.evs.find(e=>e.id===OPEN),b=EVC[OPEN];ph.seen.add(OPEN);
    if(!b)send({type:'getEv',id:OPEN});else if(b.typ==='foto'&&!IMGC[OPEN]&&b.media==='ok'&&!ph['req'+OPEN]){ph['req'+OPEN]=1;send({type:'getEv',id:OPEN})}
    const onTV=s.shown===OPEN;
    h=`<div class="pbody reader"><div class="rbar"><button class="btn sec" data-a="close">‹ Akte</button>
      ${meta.typ==='audio'?(s.playing===OPEN?`<button class="btn" data-a="stop">⏹ Stopp</button>`:`<button class="btn" data-a="play" data-v="${OPEN}">▶︎ Am TV abspielen</button>`)
        :onTV?`<button class="btn sec" data-a="up">▲</button><button class="btn sec" data-a="down">▼</button>`:`<button class="btn" data-a="show" data-v="${OPEN}">📺 Am TV zeigen</button>`}</div>
      ${b?docHTML(b,{img:IMGC[OPEN]||'',playing:s.playing===OPEN,heard:!!b.zeilen}):'<div class="center">Lade …</div>'}
      ${b&&b.typ==='raetsel'&&!b.cracked&&['play','accuse'].includes(s.phase)?`<label class="l">${esc(b.frage||'Code')}</label><input class="in" id="rc" maxlength="30" autocomplete="off" autocapitalize="characters" placeholder="Code, Zahl oder Wort" value="${esc(ph.rc||'')}">
        <button class="btn" data-a="crack" data-v="${OPEN}">🔓 Öffnen</button><div class="note">Falsche Codes kosten 2 Punkte.</div>
        ${b.hinweis?'':`<button class="btn sec small" data-a="rhint" data-v="${OPEN}">${ph.confirm==='rhint'?'Wirklich einen Tipp nehmen? (−5)':'💡 Tipp (−5 Punkte)'}</button>`}`:''}</div>`}
  else if(TAB==='akte'){h=`<div class="pbody">${s.waiting?'<div class="note">🔬 Neue Beweise werden noch ausgewertet …</div>':''}${s.chTitles.map((t,k)=>{const l=s.evs.filter(e=>e.ch===k);if(!l.length)return '';
      return `<label class="l">Kapitel ${k+1} · ${esc(t)}</label><div class="plist">${l.map(e=>`<button class="pitem ${ph.seen.has(e.id)?'':'new'} ${s.shown===e.id?'cur':''}" data-a="open" data-v="${e.id}"><span class="ic">${e.typ==='raetsel'&&e.cracked?'🔓':ICON[e.typ]}</span><span class="tt"><b>${esc(e.titel)}</b><small>${e.typ==='raetsel'&&e.cracked?'Geöffnet':TYPNAME[e.typ]}${s.shown===e.id?' · 📺 am TV':''}${e.typ==='audio'&&!e.heard?' · noch nicht gehört':''}</small></span>›</button>`).join('')}</div>`}).join('')}
      <label class="l">Fall</label><div class="doc" style="font-size:14px">${esc(s.case.einleitung)}<p style="margin-top:.8em"><b>Opfer:</b> ${esc(s.case.opfer&&s.case.opfer.name)} – ${esc(s.case.opfer&&s.case.opfer.beschreibung)}</p></div></div>`}
  else if(TAB==='pers'){h=`<div class="pbody"><div class="note" style="margin-top:0">Markiert gemeinsam, wen ihr verdächtigt – das sehen alle am Fernseher.</div>${s.case.personen.map(p=>{const mk=s.marks[p.id];
      return `<div class="susp"><div class="h"><span class="dot" style="background:${p.verdaechtig?'#596178':'#2f4a3d'}">${esc(p.name[0])}</span><div><b>${esc(p.name)}</b><small>${esc([p.rolle,p.alter?p.alter+' J.':''].filter(Boolean).join(' · '))}${p.verdaechtig?'':' · Zeuge'}</small></div></div><p>${esc(p.beschreibung||'')}</p>
        ${mk?`<div class="seg">${Object.entries(MARKS).map(([k,l])=>`<button class="${k} ${mk===k?'on':''}" data-a="mark" data-id="${p.id}" data-v="${k}">${l}</button>`).join('')}</div>`:''}</div>`}).join('')}</div>`}
  else{ // Auftrag
    if(s.phase==='accuse'){const a=ph.acc,an=s.anklage,ok=a.taeter&&a.motiv!==''&&a.methode!==''&&a.beweis;
      h=`<div class="pbody"><div class="tbox"><div class="lbl">Anklage</div><div class="q">Wer ist der Täter, warum und wie – und welcher Beweis überführt ihn?</div></div>
        <label class="l">Täter</label>${s.case.personen.filter(p=>p.verdaechtig).map(p=>`<button class="opt ${a.taeter===p.id?'on':''}" data-a="acc" data-k="taeter" data-v="${p.id}">${esc(p.name)}</button>`).join('')}
        <label class="l">Motiv</label>${an.motive.map((m,i)=>`<button class="opt ${a.motiv===String(i)?'on':''}" data-a="acc" data-k="motiv" data-v="${i}">${esc(m)}</button>`).join('')}
        <label class="l">Methode</label>${an.methoden.map((m,i)=>`<button class="opt ${a.methode===String(i)?'on':''}" data-a="acc" data-k="methode" data-v="${i}">${esc(m)}</button>`).join('')}
        <label class="l">Entscheidender Beweis</label><select class="in" id="bew"><option value="">– Beweis wählen –</option>${s.evs.map(e=>`<option value="${e.id}" ${a.beweis===e.id?'selected':''}>${ICON[e.typ]} ${esc(e.titel)}</option>`).join('')}</select>
        <button class="btn" data-a="accuse" ${ok?'':'disabled'}>${ph.confirm==='accuse'?'Sicher? Nochmal tippen!':'⚖️ Anklage erheben'}</button><div class="note">Das ist endgültig – sprecht euch vorher ab.</div></div>`}
    else if(s.waiting||!s.task){h=`<div class="pbody"><div class="center"><div class="big">🔬</div>Die Spurensicherung wertet die neuen Beweise aus …</div>${genList(s)}</div>`}
    else{const t=s.task;
      h=`<div class="pbody"><div class="tbox"><div class="lbl">Auftrag · Kapitel ${s.ch+1}</div><div class="q">${esc(t.frage)}</div>${t.hints.map((x,i)=>`<div class="hintp">💡 Tipp ${i+1}: ${esc(x)}</div>`).join('')}</div>
        ${t.typ==='person'?s.case.personen.map(p=>`<button class="opt ${ph.sel===p.id?'on':''}" data-a="sel" data-v="${p.id}">${esc(p.name)} <small style="color:var(--mute)">· ${esc(p.rolle||'')}</small></button>`).join('')
         :t.typ==='auswahl'?t.optionen.map(o=>`<button class="opt ${ph.sel===o?'on':''}" data-a="sel" data-v="${esc(o)}">${esc(o)}</button>`).join('')
         :`<label class="l">Antwort</label><input class="in" id="code" maxlength="30" autocomplete="off" placeholder="Code, Zahl oder Wort" value="${esc(ph.code)}">`}
        <button class="btn" data-a="answer">${ph.confirm==='answer'?'Sicher? Nochmal tippen!':'Antwort abgeben'}</button>
        <div class="note">Falsche Antworten kosten 10 Punkte, ein Tipp kostet 5.</div>
        ${t.more?`<button class="btn sec small" data-a="hint">${ph.confirm==='hint'?'Wirklich einen Tipp nehmen?':'💡 Tipp anzeigen'}</button>`:''}</div>`}
    if(isHost)h=h.replace(/<\/div>$/,`<button class="btn sec small" data-a="discard" style="margin-top:28px">${ph.confirm==='discard'?'Wirklich beenden? Der Fall wird gelöscht.':'🏁 Fall beenden & neuen Fall erstellen'}</button></div>`)}
  if(s.flash){const f=s.flash;h=`<div class="pbody"><div class="center"><div class="big">${f.ok?'✅':'❌'}</div><h2 style="color:var(--txt)">${f.ok?'Richtig!':'Leider falsch'}</h2>${f.ok?esc(f.t)+'<br><br><b style="color:var(--amber)">'+esc(f.next)+'</b>':`„${esc(f.v)}“ passt nicht. −10 Punkte`}</div></div>`}
  const tabs=`<div class="tabs">${[['akte','🗂️','Akte',newEv],['pers','👥','Personen',0],['task','❓',s.phase==='accuse'?'Anklage':'Auftrag',0]].map(([k,i,l,n])=>`<button class="${TAB===k?'on':''}" data-a="tab" data-v="${k}"><span>${i}</span>${l}${n?`<i class="badge">${n}</i>`:''}</button>`).join('')}</div>`;
  root.innerHTML=top+h+tabs;if(renderPhone.tab===TAB+OPEN)scrollTo(0,sy);else scrollTo(0,0);renderPhone.tab=TAB+OPEN}
function genList(s){return `<div class="steps" style="font-size:15px;gap:8px;margin-top:10px">${(s.gen.steps||[]).map(x=>`<div class="${x.state}">${x.state==='now'?'<span class="spin" style="width:16px;height:16px"></span>':x.state==='ok'?'✅':'⚠️'} ${esc(x.label)}</div>`).join('')}</div>`}
setInterval(()=>{const t=$('#ptm');if(t&&ST&&ST.run){ST.elapsed+=1000;t.textContent=fmtT(ST.elapsed)}},1000);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||MODE!=='phone')return;const a=b.dataset.a,v=b.dataset.v;
  const twice=k=>{if(ph.confirm===k){ph.confirm='';return true}ph.confirm=k;setTimeout(()=>{if(ph.confirm===k){ph.confirm='';renderPhone()}},3500);renderPhone();return false};
  switch(a){
    case 'join':{const n=$('#nm').value.trim();if(!n)return;ph.name=n;try{localStorage.setItem('ck_name',n)}catch(x){}send({type:'join',name:n});break}
    case 'chip':ph.wish=v;send({type:'wish',v});renderPhone();break;
    case 'min':send({type:'opts',min:+v});break;
    case 'lvl':send({type:'opts',level:v});break;
    case 'key':{const k=$('#key').value.trim();if(k){send({type:'gemSet',key:k});$('#key').value=''}break}
    case 'create':{const w=$('#wish').value.trim();if(!w)return;ph.wish=null;send({type:'wish',v:w});send({type:'create'});break}
    case 'retry':send({type:'retry'});break;
    case 'discard':if(twice('discard'))send({type:'discard'});break;
    case 'begin':send({type:'begin'});break;
    case 'toFile':send({type:'toFile'});break;
    case 'tab':TAB=v;OPEN=null;ph.confirm='';renderPhone();break;
    case 'open':OPEN=v;renderPhone();break;
    case 'close':OPEN=null;renderPhone();break;
    case 'show':send({type:'show',id:v});break;
    case 'play':send({type:'play',id:v});break;
    case 'stop':send({type:'stop'});break;
    case 'up':send({type:'scroll',d:-1});break;case 'down':send({type:'scroll',d:1});break;
    case 'mark':send({type:'mark',id:b.dataset.id,v});break;
    case 'sel':ph.sel=v;renderPhone();break;
    case 'hint':if(twice('hint'))send({type:'hint'});break;
    case 'answer':{const c=$('#code');const val=ST.task&&ST.task.typ==='code'?(c?c.value.trim():''):ph.sel;if(c)ph.code=c.value;if(!val)return;
      if(twice('answer')){send({type:'answer',v:val});ph.sel=null;ph.code=''}break}
    case 'acc':ph.acc[b.dataset.k]=v;renderPhone();break;
    case 'accuse':{const sel=$('#bew');if(sel)ph.acc.beweis=sel.value;if(twice('accuse'))send({type:'accuse',...ph.acc});break}
    case 'playSol':send({type:'play',id:'sol'});break;
    case 'newGame':send({type:'newGame'});break
    case 'claim':if(twice('claim'))send({type:'claimHost'});break
    case 'crack':{const c=$('#rc');const val=c?c.value.trim():'';if(!val)return;send({type:'crack',id:v,v:val});ph.rc='';if(c)c.value='';break}
    case 'rhint':if(twice('rhint'))send({type:'rhint',id:v});break}});
document.addEventListener('input',e=>{if(e.target.id==='wish')ph.wish=e.target.value;if(e.target.id==='code')ph.code=e.target.value;if(e.target.id==='rc')ph.rc=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='bew'){ph.acc.beweis=e.target.value;renderPhone()}});
document.addEventListener('focusout',e=>{if(MODE==='phone'&&e.target.id==='wish'&&ph.wish!=null&&ST&&ph.wish!==ST.wish)send({type:'wish',v:ph.wish});setTimeout(renderPhone,50)});

/* =====================================================================
   START
   ===================================================================== */
if(MODE==='tv'){
  $('#tv').classList.remove('hide');fitTV();addEventListener('resize',fitTV);
  try{K.wish=localStorage.getItem('ck_wish')||''}catch(e){}
  loadPlayers();
  // Fernbedienung: OK spielt die gezeigte Tonaufnahme bzw. stoppt sie
  addEventListener('keydown',e=>{if(e.key==='Enter'||e.keyCode===23){if(PLAYING)stopAudio();else if(K.shown&&evById(K.shown)&&evById(K.shown).typ==='audio')playAudio(K.shown)}});
  renderTV();
  resume().then(()=>{renderTV();pushAll()});
  if(typeof Peer!=='undefined')hostNet();
  setInterval(()=>{const p=NET.peer;if(p&&!p.destroyed&&p.disconnected){try{p.reconnect()}catch(e){}}},5000);
  if(GEM.key)listModels();
  // Spielzeit regelmäßig sichern
  setInterval(()=>{if(K.runAt){K.elapsed=elapsed();K.runAt=now();saveProg()}},15000)}
else{$('#ph').classList.remove('hide');phoneNet()}
