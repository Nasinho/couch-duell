<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Couch-Krimi</title>
<meta name="theme-color" content="#14161c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Special+Elite&family=Caveat:wght@500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161c;--panel:#1f232d;--panel2:#272c38;--line:#363c4a;--txt:#eef0f5;--mute:#98a0b3;--paper:#f3ead3;--paper2:#e9dcba;--ink:#2b2620;--red:#d23c46;--amber:#e6a83a;--green:#3fb37f;--blue:#4c8dff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.hide{display:none!important}

/* ---------- Dokumente (TV und Handy) ---------- */
.doc{background:var(--paper);color:var(--ink);border-radius:6px;padding:1.6em 1.8em;font-family:"Special Elite",Courier,monospace;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.45);position:relative}
.doc h3{font-family:Inter,sans-serif;font-weight:800;margin:0 0 .2em;font-size:1.15em;letter-spacing:.02em}
.doc .sub{font-family:Inter,sans-serif;color:#6b6152;font-size:.8em;margin-bottom:1em}
.doc .stamp{position:absolute;right:1.2em;top:1em;border:3px solid var(--red);color:var(--red);font-family:Inter,sans-serif;font-weight:800;padding:.1em .5em;transform:rotate(8deg);opacity:.75;font-size:.8em;letter-spacing:.1em}
.doc p{margin:.5em 0;white-space:pre-wrap}
.doc .qa{display:grid;grid-template-columns:auto 1fr;gap:.35em .8em}
.doc .qa b{font-family:Inter,sans-serif;font-size:.85em;padding-top:.1em;white-space:nowrap}
.doc table{width:100%;border-collapse:collapse;font-size:.9em}
.doc th{font-family:Inter,sans-serif;text-align:left;border-bottom:2px solid var(--ink);padding:.3em .4em;font-size:.85em}
.doc td{border-bottom:1px dashed #b7a988;padding:.3em .4em;vertical-align:top}
.doc .kv{display:grid;grid-template-columns:auto 1fr;gap:.25em 1em;margin-bottom:.8em}
.doc .kv b{font-family:Inter,sans-serif;font-size:.85em}
.doc.notiz{background:#fff8b5;font-family:Caveat,cursive;font-size:1.35em;transform:rotate(-.6deg)}
.doc.zeitung{font-family:Georgia,serif;background:#efeae0}
.doc.web{padding:0;background:#fff;overflow:hidden;font-family:Inter,Arial,sans-serif}
.doc.web .bar{display:flex;align-items:center;gap:.5em;background:#e6e8ee;padding:.45em .7em;border-bottom:1px solid #cfd3dc}
.doc.web .bar i{width:.7em;height:.7em;border-radius:50%;background:#ff5f57;display:inline-block}.doc.web .bar i+i{background:#febc2e}.doc.web .bar i+i+i{background:#28c840}
.doc.web .url{flex:1;background:#fff;border-radius:99px;padding:.2em .8em;font-size:.72em;color:#4a5060;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc.web .hero{padding:.9em 1.1em;color:#fff;background:linear-gradient(120deg,var(--wc,#2b5cab),#1b2233)}
.doc.web .hero b{font-size:.75em;opacity:.85;letter-spacing:.06em;text-transform:uppercase}.doc.web .hero h3{margin:.15em 0 0;font-size:1.45em;line-height:1.15}
.doc.web .body{padding:.6em 1.1em 1em}.doc.web .sec{margin:.7em 0}.doc.web .sec h4{margin:0 0 .2em;font-size:1em;color:#1b2233}.doc.web .sec p{margin:0}
.doc.web .com{border-top:1px solid #e3e5ea;margin-top:.8em;padding-top:.5em}.doc.web .com div{background:#f3f4f7;border-radius:.6em;padding:.4em .7em;margin:.4em 0;font-size:.9em}
.doc.web .sbar{background:var(--wc);color:#fff;font-weight:800;padding:.4em 1.1em;letter-spacing:.02em}
.doc.web .prof{display:flex;gap:.8em;padding:.9em 1.1em;border-bottom:1px solid #e3e5ea}.doc.web .av{flex:none;width:2.6em;height:2.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.doc.web .prof u{text-decoration:none;color:#7a8090}.doc.web .prof p{margin:.2em 0}.doc.web .prof small{color:#7a8090}
.doc.web .post{border:1px solid #e3e5ea;border-radius:.7em;padding:.6em .8em;margin:.6em 0}.doc.web .post .ph{color:#7a8090;font-size:.8em}.doc.web .post p{margin:.3em 0}.doc.web .post .lk{color:#d0315a;font-size:.85em}
.doc.web .fpost{border-bottom:1px solid #e3e5ea;padding:.6em 0}.doc.web .fu{display:flex;align-items:center;gap:.5em}.doc.web .fu .av{width:1.8em;height:1.8em;font-size:.8em}.doc.web .fu small{color:#7a8090;margin-left:auto}.doc.web .fpost p{margin:.35em 0 0}
.doc.web .sq{border:1px solid #d5d8df;border-radius:99px;padding:.35em .9em;margin:.3em 0 .6em}.doc.web .hit{margin:.75em 0}.doc.web .hit .hq{font-size:.78em;color:#7a8090}
.doc.web .hit a{display:block;color:#1a4fc4;font-weight:600}.doc.web .hit cite{display:block;font-style:normal;color:#1d7a3a;font-size:.8em}.doc.web .hit p{margin:.15em 0 0;font-size:.9em}
.doc.web.login .body{padding:1em 1.2em}.doc.web .lk2{font-weight:800;color:#8a6a00;letter-spacing:.05em;margin-bottom:.4em}.doc.web .lf{margin-top:.8em;padding:.7em .9em;border:1px solid #cfd3dc;border-radius:.5em;background:#f6f7f9;font-family:ui-monospace,Menlo,monospace}
.doc.web .lf.ok{border-color:#2f9e6a;color:#1d7a4f}.doc.web .lh{margin-top:.6em;color:#8a6a00}
.doc.web .com u{text-decoration:none;color:#7a8090;font-size:.8em;margin-left:.5em}.doc.web .stars{color:#e6a700;letter-spacing:.05em}
.doc.zeitung .zt{font-family:"Playfair Display",serif;font-weight:900;font-size:1.1em;border-bottom:3px double var(--ink);text-align:center;padding-bottom:.2em;margin-bottom:.4em;letter-spacing:.05em}
.doc.zeitung h3{font-family:"Playfair Display",serif;font-size:1.6em;line-height:1.1}
.doc.zeitung p{columns:2;column-gap:1.4em}
.doc.chat{background:#e5ddd5;font-family:Inter,sans-serif}
.chatwrap{display:flex;flex-direction:column;gap:.45em}
.bub{max-width:80%;padding:.45em .7em;border-radius:.8em;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.15);font-size:.95em}
.bub.me{align-self:flex-end;background:#d9fdd3}
.bub i{display:block;font-style:normal;font-size:.72em;color:#667;margin-bottom:.1em;font-weight:600}
.bub u{display:block;text-decoration:none;font-size:.68em;color:#889;text-align:right}
.doc.email .kv{border-bottom:1px solid #b7a988;padding-bottom:.6em}
.doc.foto{background:#fdfdfb;padding:1em 1em 1.4em;font-family:Caveat,cursive}
.doc.foto img{width:100%;display:block;border-radius:2px;background:#222}
.doc.foto .cap{font-size:1.4em;margin-top:.4em}
.doc.lock{background:linear-gradient(160deg,#3b404c,#252932);color:#e9ecf3;border:2px solid #59606f;font-family:Inter,sans-serif}
.doc.lock h3{color:#fff}.doc.lock .sub{color:#aab1c0}.doc.lock .lk{font-weight:800;font-size:.75em;letter-spacing:.1em;text-transform:uppercase;color:#f1c75b;margin-bottom:.4em}
.doc.lock.open .lk{color:#5fd39a}.doc.lock .lq{margin-top:.8em;padding:.5em .8em;border:2px dashed #f1c75b;border-radius:.4em;font-family:ui-monospace,Menlo,monospace;color:#f1c75b}
.doc.lock.open .lq{border-color:#5fd39a;color:#5fd39a}.doc.lock .lh{margin-top:.6em;color:#ffd98a}
.reward{margin:.9em 0 .4em;color:#5fd39a;font:800 1em Inter,sans-serif}
.doc.foto .vm{margin-top:.7em;padding:.55em .8em;background:#fff8d6;border-left:4px solid #d9a400;font:1em/1.45 Inter,sans-serif;color:#2a2a2a}
.doc.foto .vm b{display:block;font-size:.7em;letter-spacing:.08em;text-transform:uppercase;color:#8a6a00;margin-bottom:.15em}
.doc.foto .cred{font:11px/1.3 Inter,sans-serif;color:#8a8f9c;margin-top:.5em}
.doc.foto .ph{aspect-ratio:4/3;background:repeating-linear-gradient(45deg,#2d3038,#2d3038 12px,#33373f 12px,#33373f 24px);color:#cfd3dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5em;font-family:Inter,sans-serif;font-size:.9em}
.doc.audio{background:#202530;color:var(--txt);font-family:Inter,sans-serif}
.doc.audio .sub{color:var(--mute)}
.doc.audio .line{margin:.35em 0}.doc.audio .line b{color:var(--amber)}
.wave{display:flex;gap:4px;align-items:center;height:60px;margin:.5em 0 1em}
.wave i{flex:1;background:var(--amber);border-radius:3px;opacity:.35;height:20%}
.wave.on i{animation:wv 1s ease-in-out infinite;opacity:.9}
@keyframes wv{0%,100%{height:15%}50%{height:95%}}
.doc.karte svg{width:100%;display:block;border-radius:4px}
.doc .lock{font-family:Inter,sans-serif;color:#6b6152}

/* ---------- Fernseher ---------- */
#tv{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(1200px 700px at 70% -10%,#2a3040 0%,var(--bg) 60%)}
.tvh{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:28px;padding:0 44px;border-bottom:1px solid var(--line);background:rgba(20,22,28,.7)}
.brand{font-family:"Playfair Display",serif;font-weight:900;font-size:40px;letter-spacing:.01em}.brand b{color:var(--red)}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:8px 20px;font-size:24px;color:var(--mute);white-space:nowrap}
.pill b{color:var(--txt)}
.grow{flex:1}
.lobby{position:absolute;inset:96px 0 0 0;display:grid;grid-template-columns:520px 1fr;gap:56px;padding:60px 80px}
.qrbox{background:#fff;color:#1b1e26;border-radius:28px;padding:34px;text-align:center;align-self:start}
.qrbox svg{width:330px;height:330px;display:block;margin:0 auto}
.qrbox .code{font-size:84px;font-weight:800;letter-spacing:.14em;color:var(--red);margin-top:6px}
.qrbox .u{color:#667;font-size:20px}
.lob-r h1{font-family:"Playfair Display",serif;font-size:76px;margin:0 0 10px;line-height:1.05}
.lob-r .lead{font-size:30px;color:var(--mute);margin:0 0 36px;max-width:1100px}
.players{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:36px}
.pl{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:10px 26px 10px 10px;font-size:28px;font-weight:600}
.dot{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:22px;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 34px}
.steps{display:grid;gap:12px;font-size:26px}
.steps div{display:flex;gap:14px;align-items:center;color:var(--mute)}
.steps .ok{color:var(--txt)}.steps .now{color:var(--amber)}.steps .bad{color:var(--red)}
.spin{width:24px;height:24px;border:3px solid var(--amber);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.casecard h2{font-family:"Playfair Display",serif;font-size:52px;margin:0 0 8px}
.casecard .meta{color:var(--amber);font-size:26px;margin-bottom:14px}
.casecard p{font-size:26px;line-height:1.45;color:#d6dae4;margin:0}
.hintline{margin-top:22px;font-size:26px;color:var(--mute)}
/* Ermittlung */
.play{position:absolute;inset:96px 0 0 0;display:grid;grid-template-columns:430px 1fr 470px;gap:26px;padding:26px 34px}
.evlist{overflow:hidden;display:flex;flex-direction:column;gap:10px}
.evlist h4,.side h4{margin:0 0 4px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ev{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:21px;line-height:1.2}
.ev .ic{font-size:28px;width:36px;text-align:center;flex:none}
.ev small{display:block;color:var(--mute);font-size:16px}
.ev.cur{border-color:var(--amber);background:#2f2a1e}
.ev.new{box-shadow:0 0 0 2px var(--red) inset}
.ev.lockd{opacity:.35}
.chsep{font-size:17px;color:var(--mute);margin:6px 0 0;letter-spacing:.1em;text-transform:uppercase}
.viewer{position:relative;overflow:hidden;border-radius:16px}
.vscroll{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;padding:6px 10px 40px;scrollbar-width:none}
.vscroll::-webkit-scrollbar{display:none}
.viewer .doc{font-size:27px;max-width:1000px;margin:0 auto}
.viewer .doc.foto{max-width:900px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);font-size:30px;text-align:center;gap:16px}
.empty .big{font-size:90px}
.side{display:flex;flex-direction:column;gap:20px;overflow:hidden}
.task{background:linear-gradient(180deg,#2d2230,#231d27);border:1px solid #5a3a46;border-radius:20px;padding:24px 26px}
.task .lbl{color:#ff8b93;font-size:18px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.task .q{font-size:27px;font-weight:600;margin:10px 0 0;line-height:1.3}
.task .opts{margin-top:12px;display:grid;gap:6px;font-size:21px;color:#d9cfd8}
.task .hint{margin-top:12px;background:rgba(230,168,58,.12);border-left:4px solid var(--amber);padding:10px 14px;border-radius:6px;font-size:20px;color:#f2dfb6}
.sus{display:grid;gap:10px}
.su{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.su .nm{font-size:22px;font-weight:700;line-height:1.15}
.su .rl{font-size:16px;color:var(--mute)}
.su .mk{margin-left:auto;font-size:15px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.mk.v{background:rgba(210,60,70,.2);color:#ff8b93}.mk.e{background:rgba(63,179,127,.18);color:#7fe0b4}.mk.q{background:rgba(152,160,179,.15);color:var(--mute)}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:14px 30px;border-radius:99px;font-size:26px;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.overlay{position:absolute;inset:0;background:rgba(10,11,15,.88);display:flex;align-items:center;justify-content:center;z-index:5}
.ovbox{max-width:1300px;text-align:center}
.ovbox .big{font-size:120px}
.ovbox h2{font-family:"Playfair Display",serif;font-size:72px;margin:10px 0}
.ovbox p{font-size:30px;color:#d6dae4;line-height:1.45}
.brief{position:absolute;inset:96px 0 0 0;display:flex;align-items:center;justify-content:center;padding:60px 140px}
.brief .file{background:var(--paper);color:var(--ink);border-radius:8px;padding:56px 70px;max-width:1500px;box-shadow:0 30px 70px rgba(0,0,0,.5);position:relative;font-family:"Special Elite",monospace}
.brief .file h2{font-family:"Playfair Display",serif;font-size:66px;margin:0 0 10px;line-height:1.05}
.brief .file .meta{font-family:Inter,sans-serif;color:#6b6152;font-size:26px;margin-bottom:24px}
.brief .file p{font-size:30px;line-height:1.5;margin:0}
.brief .file .stamp{position:absolute;right:50px;top:40px;border:5px solid var(--red);color:var(--red);font-family:Inter,sans-serif;font-weight:800;font-size:30px;padding:4px 16px;transform:rotate(9deg);opacity:.8;letter-spacing:.12em}
.result{position:absolute;inset:96px 0 0 0;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:50px 80px;overflow:hidden}
.result h2{font-family:"Playfair Display",serif;font-size:64px;margin:0 0 14px}
.rrow{display:flex;justify-content:space-between;gap:20px;font-size:27px;padding:14px 0;border-bottom:1px solid var(--line)}
.rrow b.ok{color:var(--green)}.rrow b.no{color:var(--red)}
.score{font-size:110px;font-weight:800;color:var(--amber);line-height:1}
.sol{font-size:25px;line-height:1.5;color:#d6dae4;white-space:pre-wrap}

/* ---------- Handy ---------- */
#ph{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.ptop{position:sticky;top:0;z-index:3;background:rgba(20,22,28,.95);backdrop-filter:blur(6px);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ptop .t{font-weight:800;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptop .tm{color:var(--amber);font-variant-numeric:tabular-nums;font-weight:700}
.ptop .claim{border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:5px 10px;font:600 12px Inter,sans-serif;white-space:nowrap}.ptop .claim.on{color:var(--amber);border-color:var(--amber)}
.pbody{flex:1;padding:16px 16px 100px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#191c24;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:4}
.tabs button{flex:1;background:none;border:0;color:var(--mute);padding:10px 0 12px;font-size:12px;font-weight:600;position:relative}
.tabs button span{display:block;font-size:22px}
.tabs button.on{color:var(--txt)}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:17px;background:var(--red);color:#fff;margin-top:12px}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.small{padding:10px;font-size:15px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row .btn{flex:1}
input.in,textarea.in,select.in{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px}
textarea.in{resize:none}
label.l{display:block;color:var(--mute);font-size:13px;font-weight:600;margin:16px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:8px 13px;font-size:14px}
.chip.on{background:var(--red);border-color:var(--red)}
.note{color:var(--mute);font-size:14px;margin-top:10px;line-height:1.4}
.note.ok{color:#7fe0b4}.note.bad{color:#ff8b93}
.plist{display:grid;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;color:var(--txt);text-align:left}
.pitem .ic{font-size:24px;width:30px;text-align:center}
.pitem .tt{flex:1;min-width:0}.pitem .tt b{display:block;font-size:15px}.pitem .tt small{color:var(--mute);font-size:12px}
.pitem.new{box-shadow:0 0 0 2px var(--red) inset}
.pitem.cur{border-color:var(--amber)}
.reader .doc{font-size:15px;padding:1.2em 1.1em}
.rbar{position:sticky;top:57px;z-index:2;display:flex;gap:8px;background:var(--bg);padding:6px 0 10px}
.rbar .btn{margin:0;padding:11px 8px;font-size:14px}
.susp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.susp .h{display:flex;gap:12px;align-items:center}
.susp .h b{font-size:16px}.susp .h small{display:block;color:var(--mute);font-size:13px}
.susp p{margin:8px 0 0;font-size:14px;color:#c9cedb;line-height:1.4}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--mute);border-radius:10px;padding:8px 4px;font-size:13px;font-weight:700}
.seg button.on.v{background:var(--red);color:#fff;border-color:var(--red)}
.seg button.on.q{background:#596178;color:#fff}
.seg button.on.e{background:var(--green);color:#fff;border-color:var(--green)}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;margin-top:8px;font-size:15px}
.opt.on{border-color:var(--amber);background:#2f2a1e}
.tbox{background:linear-gradient(180deg,#2d2230,#231d27);border:1px solid #5a3a46;border-radius:16px;padding:16px}
.tbox .lbl{color:#ff8b93;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.tbox .q{font-size:17px;font-weight:600;margin-top:6px;line-height:1.35}

<body>
<div id="tv" class="hide"></div>
<div id="ph" class="hide"></div>
<div id="net" class="net hide"></div>
<audio id="aud" preload="auto"></audio>
<script src="../vendor/peerjs.min.js"></script>
<script src="../vendor/qrcode.min.js"></script>
<script>
'use strict';
/* =====================================================================
   COUCH-KRIMI – ein KI-Kriminalfall für den Fernseher, die Handys sind die Ermittler-Akten.
   Der Fernseher schreibt mit Gemini den Fall (Fallplan → Kapitel → Fotos → Stimmen), hält den Spielstand
   und speichert alles in IndexedDB, damit ein Neuladen den Fall nicht beendet.
   ===================================================================== */
const APPV='2026-11-15ke';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const norm=s=>String(s==null?'':s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const BASE=location.origin+location.pathname;
const QS=new URLSearchParams(location.search);
let ROOM=(QS.get('r')||location.hash.slice(1)||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
const MODE=ROOM||QS.has('join')?'phone':'tv';
const COLORS=['#d23c46','#4c8dff','#3fb37f','#e6a83a','#a46bff','#ff7ab6'];
const ICON={protokoll:'🗣️',chat:'💬',email:'✉️',brief:'📄',notiz:'📝',zeitung:'📰',liste:'📋',bericht:'🔬',foto:'📷',audio:'🎧',karte:'🗺️',webseite:'🌐',raetsel:'🔒'};
const TYPNAME={protokoll:'Vernehmung',chat:'Chatverlauf',email:'E-Mail',brief:'Brief',notiz:'Notiz',zeitung:'Zeitung',liste:'Liste',bericht:'Bericht',foto:'Foto',audio:'Tonaufnahme',karte:'Lageplan',webseite:'Webseite',raetsel:'Verschlossen'};
const MARKS={q:'offen',v:'verdächtig',e:'entlastet'};
const fmtT=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

/* ---------- Speicher am Fernseher (IndexedDB, Blobs für Bilder und Ton) ---------- */
const DB={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((ok,no)=>{const r=indexedDB.open('couchkrimi',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(this.db=r.result);r.onerror=()=>no(r.error)})},
  async run(mode,fn){const db=await this.open();return new Promise((ok,no)=>{const tx=db.transaction('kv',mode),st=tx.objectStore('kv'),r=fn(st);
    tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>no(tx.error)})},
  get(k){return this.run('readonly',s=>s.get(k)).catch(()=>null)},
  set(k,v){return this.run('readwrite',s=>s.put(v,k)).catch(()=>null)},
  clear(){return this.run('readwrite',s=>s.clear()).catch(()=>null)}};

/* =====================================================================
   GEMINI – Text (Fall), Bilder (Beweisfotos), Sprache (Tonaufnahmen)
   Welche Modelle es gibt, fragt der Fernseher einmal bei Google ab und wählt die passenden aus.
   ===================================================================== */
const GEM={key:'',text:['gemini-3.5-flash-lite','gemini-3.1-flash-lite'],img:[],tts:[],listed:false,last:'',dead:new Set(),noMulti:(()=>{try{return localStorage.getItem('ck_nomulti')==='1'}catch(e){return false}})()};
// 429 mit „limit: 0“ bzw. Tageslimit: dieses Modell ist für den Key erschöpft – nicht weiter anfragen (spart Kontingent)
const hardQuota=e=>e&&e.code==='rate_limited'&&/limit:\s*0\b|per\s*day|PerDay|daily/i.test(e.message||'');
const alive=l=>l.filter(m=>!GEM.dead.has(m.n||m));
try{GEM.key=localStorage.getItem('ck_gem_key')||localStorage.getItem('cd_gem_key')||''}catch(e){}
const API='https://generativelanguage.googleapis.com/v1beta/';
const vnum=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
async function listModels(){
  if(GEM.listed||!GEM.key)return;
  try{const r=await fetch(`${API}models?pageSize=1000&key=${encodeURIComponent(GEM.key)}`);if(!r.ok)return;
    const d=await r.json(),ms=(d.models||[]).map(m=>({n:String(m.name||'').replace(/^models\//,''),g:(m.supportedGenerationMethods||[])}));
    const gen=ms.filter(m=>m.g.includes('generateContent')),pre=n=>/preview|exp/.test(n)?.5:0;
    const text=gen.filter(m=>/^gemini-\d/.test(m.n)&&!/tts|image|embed|live|audio|native|robot|computer|learnlm|thinking/.test(m.n));
    const rank=n=>vnum(n)*10+(/flash-lite/.test(n)?1:/flash/.test(n)?2:/pro/.test(n)?0:-5)-pre(n)-(/-\d{3,}$/.test(n)?.2:0);
    const best=text.map(m=>m.n).sort((a,b)=>rank(b)-rank(a));
    // Für den Fall das beste „flash“, als Reserve die schnellen „flash-lite“
    const flash=best.filter(n=>/flash/.test(n)&&!/lite/.test(n)).slice(0,1),lite=best.filter(n=>/flash-lite/.test(n)).slice(0,2);
    if(flash.length||lite.length)GEM.text=[...flash,...lite];
    GEM.tts=gen.filter(m=>/tts/.test(m.n)).map(m=>m.n).sort((a,b)=>(vnum(b)*10+(/flash/.test(b)?1:0))-(vnum(a)*10+(/flash/.test(a)?1:0))).slice(0,2);
    GEM.img=[...gen.filter(m=>/image/.test(m.n)&&/gemini/.test(m.n)).map(m=>({n:m.n,k:'gem'})).sort((a,b)=>(vnum(b.n)*10+(/flash/.test(b.n)?1:0))-(vnum(a.n)*10+(/flash/.test(a.n)?1:0))),
      ...ms.filter(m=>/^imagen/.test(m.n)&&m.g.includes('predict')).map(m=>({n:m.n,k:'imagen'}))].slice(0,3);
    GEM.listed=true}catch(e){}}
// Ein Aufruf mit Abbruch nach Leerlauf; Fehler tragen einen Code (rate_limited / bad_key / error)
async function gemCall(model,body,{stream=false,idle=90000,method='generateContent'}={}){
  GEM.last=model;
  const url=`${API}models/${encodeURIComponent(model)}:${method==='generateContent'&&stream?'streamGenerateContent?alt=sse&':method+'?'}key=${encodeURIComponent(GEM.key)}`;
  const ctl=GEN.ctl=new AbortController();let why='',t=null;const arm=()=>{clearTimeout(t);t=setTimeout(()=>{why=`keine Antwort nach ${idle/1000} s`;ctl.abort()},idle)};
  try{arm();let res;
    try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal})}
    catch(e){throw Object.assign(new Error(why||e.message||'Netzwerkfehler'),{code:'error'})}
    if(!res.ok){const d=await res.json().catch(()=>({})),m=(d.error&&d.error.message)||('HTTP '+res.status);
      throw Object.assign(new Error(m),{code:res.status===429?'rate_limited':res.status===400?'bad_request':(res.status===401||res.status===403)?'bad_key':res.status===404?'no_model':'error',status:res.status})}
    if(!stream)return await res.json();
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='',out='';
    for(;;){arm();let r;try{r=await rd.read()}catch(e){throw Object.assign(new Error(why||'Verbindung abgebrochen'),{code:'error'})}
      if(r.done)break;buf+=dec.decode(r.value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(line.startsWith('data:')){try{const d=JSON.parse(line.slice(5));out+=partsOf(d).filter(p=>!p.thought).map(p=>p.text||'').join('')}catch(e){}}}
      GEN.chars=out.length;genTick()}
    return {candidates:[{content:{parts:[{text:out}]}}]}}
  finally{clearTimeout(t)}}
const partsOf=d=>(d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
const parseLoose=t=>{try{return JSON.parse(t)}catch(e){const m=String(t).match(/\{[\s\S]*\}/);if(!m)return null;try{return JSON.parse(m[0])}catch(e2){return null}}};
// JSON-Antwort, nacheinander über die Modell-Liste; bei „zu viele Anfragen“ kurz warten
async function askJSON(prompt,{think=false,tries=4}={}){
  let last;const ep=GEN.epoch;
  for(let a=0;a<tries;a++){if(ep!==GEN.epoch)throw ABORT;
    const list=alive(GEM.text);if(!list.length)throw last||new Error('Tageskontingent der Textmodelle aufgebraucht');
    const model=list[a%list.length];
    const cfg={responseMimeType:'application/json',...(think?{}:{thinkingConfig:{thinkingBudget:0}})};
    try{let d;
      try{d=await gemCall(model,{contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:cfg},{stream:true,idle:think?180000:90000})}
      catch(e){if(e.code==='bad_request'&&cfg.thinkingConfig){delete cfg.thinkingConfig;d=await gemCall(model,{contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:cfg},{stream:true,idle:180000})}else throw e}
      const j=parseLoose(partsOf(d).map(p=>p.text||'').join(''));if(j)return j;last=new Error('Antwort war kein gültiges JSON')}
    catch(e){last=e;if(e.code==='bad_key')throw e;if(hardQuota(e)){GEM.dead.add(model);continue}if(e.code==='rate_limited')await sleep(15000*(a+1))}
    await sleep(1500)}
  throw last||new Error('keine Antwort')}

/* ---------- Bilder ---------- */
const b64ToBytes=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
function shrink(blob,max=1280,q=.84){return new Promise(ok=>{const u=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b||blob),'image/jpeg',q)};
  im.onerror=()=>{URL.revokeObjectURL(u);ok(blob)};im.src=u})}
async function genImage(prompt){
  await listModels();if(!alive(GEM.img).length&&GEM.img.length)throw Object.assign(new Error('Bildkontingent für diesen Key aufgebraucht'),{code:'no_model'});
  if(!GEM.img.length)throw Object.assign(new Error('Kein Bildmodell für diesen Key freigeschaltet'),{code:'no_model'});
  const full=`Photorealistic crime scene evidence photo, police forensic documentation style, natural light, slightly grainy, 4:3. ${prompt}. No text, no captions, no watermarks, no visible faces, no blood, no gore, no dead bodies.`;
  let last;
  for(const m of alive(GEM.img)){
    for(let variant=GEM.imgVar||0;variant<3;variant++){
      try{let d,b64,mime='image/png';
        if(m.k==='imagen'){d=await gemCall(m.n,{instances:[{prompt:full}],parameters:{sampleCount:1,aspectRatio:'4:3'}},{method:'predict',idle:120000});
          const p=(d.predictions||[])[0];b64=p&&p.bytesBase64Encoded;mime=(p&&p.mimeType)||mime}
        else{const gc=variant===0?{responseModalities:['IMAGE','TEXT'],imageConfig:{aspectRatio:'4:3'}}:variant===1?{responseModalities:['IMAGE','TEXT']}:{responseModalities:['TEXT','IMAGE']};
          d=await gemCall(m.n,{contents:[{role:'user',parts:[{text:full}]}],generationConfig:gc},{idle:120000});
          const p=partsOf(d).find(x=>x.inlineData||x.inline_data),id=p&&(p.inlineData||p.inline_data);b64=id&&id.data;mime=(id&&(id.mimeType||id.mime_type))||mime}
        if(!b64)throw Object.assign(new Error('Kein Bild in der Antwort (evtl. Inhaltsfilter)'),{code:'empty'});
        if(m.k==='gem')GEM.imgVar=variant;
        return await shrink(new Blob([b64ToBytes(b64)],{type:mime}))}
      catch(e){last=e;if(e.code==='bad_request'&&m.k==='gem'&&variant<2)continue;
        if(e.code==='rate_limited'){GEM.dead.add(m.n);break}break}}}
  throw last||new Error('Bild fehlgeschlagen')}

/* ---------- Freie Fotos (Wikimedia Commons) statt KI-Bildern: kein KI-Aufruf ---------- */
const stripTags=h=>{const d=document.createElement('div');d.innerHTML=String(h||'');return (d.textContent||'').replace(/\s+/g,' ').trim()};
async function commons(q){
  const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch='+
    encodeURIComponent(q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth=1280&iiextmetadatafilter=Artist|LicenseShortName';
  const r=await fetch(u);if(!r.ok)return [];const d=await r.json();
  return Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0)).map(p=>({t:p.title,i:(p.imageinfo||[])[0]}))
    .filter(x=>x.i&&/jpe?g|png|webp/.test(x.i.mime||'')&&x.i.width>=640&&x.i.height>=400&&x.i.width<=x.i.height*2.6&&!/logo|map|karte|plan|diagram|flag|wappen|coat of arms|icon|svg|chart|portrait/i.test(x.t))}
async function findPhoto(b){
  const words=String(b.suche||b.bild||b.titel||'').replace(/[^\p{L}\p{N} ]/gu,' ').split(/\s+/).filter(Boolean);
  const ort=String(C.ort||'').split(/[,·(]/)[0].trim();
  const qs=[words.slice(0,4).join(' '),words.slice(0,2).join(' '),ort&&words[0]?ort+' '+words[0]:'',ort].filter((q,i,a)=>q&&a.indexOf(q)===i);
  const used=new Set(C.kapitel.flatMap(c=>c.beweise).map(x=>x.photoFile).filter(Boolean));
  // Treffer, dessen Dateiname am meisten Suchwörter enthält; ohne jede Übereinstimmung erst die nächste Suche probieren
  const key=[...words,ort].map(norm).filter(w=>w.length>3);const fit=x=>key.filter(w=>norm(x.t).includes(w)).length;
  for(const [qi,q] of qs.entries()){let hits=[];try{hits=await commons(q)}catch(e){}
    const free=hits.filter(x=>!used.has(x.t));if(!free.length)continue;
    const h=free.map((x,i)=>({x,sc:fit(x)*10-i})).sort((a,b)=>b.sc-a.sc)[0].x;if(!fit(h)&&qi<qs.length-1)continue;
    try{const r=await fetch(h.i.thumburl||h.i.url);if(!r.ok)continue;const bl=await shrink(await r.blob());
      const md=h.i.extmetadata||{};b.photoFile=h.t;
      b.credit=`Foto: ${stripTags(md.Artist&&md.Artist.value).slice(0,60)||'unbekannt'} · ${stripTags(md.LicenseShortName&&md.LicenseShortName.value)||'freie Lizenz'} · Wikimedia Commons`;
      return bl}catch(e){}}
  throw new Error('kein passendes freies Foto gefunden')}

/* ---------- Stimmen ---------- */
const VOICES={w:['Kore','Aoede','Leda','Despina','Sulafat','Callirrhoe','Erinome','Laomedeia','Achernar','Gacrux','Vindemiatrix','Pulcherrima'],
  m:['Charon','Orus','Puck','Fenrir','Iapetus','Algieba','Umbriel','Enceladus','Schedar','Achird','Sadaltager','Rasalgethi']};
const voiceMap={};
function voiceFor(name,g){const k=norm(name);if(voiceMap[k])return voiceMap[k];const pool=VOICES[g==='w'||g==='f'?'w':'m'];
  const used=new Set(Object.values(voiceMap));const v=pool.find(x=>!used.has(x))||pool[Object.keys(voiceMap).length%pool.length];return voiceMap[k]=v}
function wav(pcm,rate){const b=new ArrayBuffer(44),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+pcm.length,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,pcm.length,true);
  return new Blob([b,pcm],{type:'audio/wav'})}
// Ein Abschnitt hat höchstens zwei Sprecher (Grenze der Gemini-Sprachausgabe); längere Gespräche werden zusammengesetzt
async function ttsPart(lines,people,stil){
  await listModels();if(!GEM.tts.length)throw Object.assign(new Error('Kein Sprachmodell für diesen Key freigeschaltet'),{code:'no_model'});
  const names=[...new Set(lines.map(l=>l.s))];
  const tag=s=>norm(s).slice(0,20)||'sprecher';
  let text,speech;
  // Nur der reine Sprechtext – neuere Sprachmodelle lesen Regieanweisungen und Namen sonst wörtlich mit vor
  if(names.length===1||GEM.noMulti){text=lines.map(l=>l.t).join('\n');
    speech={voiceConfig:{prebuiltVoiceConfig:{voiceName:voiceFor(names[0],(people[names[0]]||{}).g)}}}}
  else{text=lines.map(l=>`${tag(l.s)}: ${l.t}`).join('\n');
    speech={multiSpeakerVoiceConfig:{speakerVoiceConfigs:names.map(n=>({speaker:tag(n),voiceConfig:{prebuiltVoiceConfig:{voiceName:voiceFor(n,(people[n]||{}).g)}}}))}}}
  let last;const ep=GEN.epoch;
  for(let a=0;a<3;a++){if(ep!==GEN.epoch)throw ABORT;const tl=alive(GEM.tts);if(!tl.length)throw last||Object.assign(new Error('Sprachkontingent für diesen Key aufgebraucht'),{code:'no_model'});
    const m=tl[a%tl.length];
    try{const d=await gemCall(m,{contents:[{role:'user',parts:[{text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:speech}},{idle:150000});
      const p=partsOf(d).find(x=>x.inlineData||x.inline_data),id=p&&(p.inlineData||p.inline_data);
      if(!id||!id.data)throw Object.assign(new Error('Keine Tonspur in der Antwort'),{code:'empty'});
      const rate=+((String(id.mimeType||id.mime_type||'').match(/rate=(\d+)/)||[])[1]||24000);return {pcm:b64ToBytes(id.data),rate}}
    catch(e){last=e;if(e.code==='bad_key')throw e;
      if(e.code==='bad_request'&&names.length>1&&!GEM.noMulti&&/speaker|multi/i.test(e.message||'')){GEM.noMulti=true;try{localStorage.setItem('ck_nomulti','1')}catch(x){}return ttsPart(lines,people,stil)}
      if(hardQuota(e)){GEM.dead.add(m);continue}if(e.code==='rate_limited')await sleep(25000*(a+1));else await sleep(2000)}}
  throw last}
async function genAudio(lines,people,stil){
  // Höchstens zwei Stimmen: weitere Sprecher übernimmt die zweite Stimme – so bleibt es bei einem einzigen Aufruf
  const two=[...new Set(lines.map(l=>l.s))].slice(0,2);if(two.length===2)lines=lines.map(l=>two.includes(l.s)?l:{...l,s:two[1]});
  const segs=[];let cur=[],set=new Set();
  for(const l of lines){if(!set.has(l.s)&&set.size>=2){segs.push(cur);cur=[];set=new Set()}cur.push(l);set.add(l.s)}
  if(cur.length)segs.push(cur);
  const parts=[];let rate=24000;
  for(const s of segs){const r=await ttsPart(s,people,stil);rate=r.rate;parts.push(r.pcm)}
  const gap=new Uint8Array(Math.round(rate*.35)*2),all=[];parts.forEach((p,i)=>{if(i)all.push(gap);all.push(p)});
  const len=all.reduce((a,p)=>a+p.length,0),pcm=new Uint8Array(len);let o=0;all.forEach(p=>{pcm.set(p,o);o+=p.length});
  return wav(pcm,rate)}

/* =====================================================================
   FALL ERZEUGEN – Fallplan, dann Kapitel für Kapitel (Text → Fotos → Stimmen)
   Kapitel 1 reicht zum Losspielen, der Rest entsteht im Hintergrund während der Ermittlung.
   ===================================================================== */
const DUR={45:4,60:5,90:7};
const LEVEL={leicht:'leicht – klare Spuren, wenige falsche Fährten, Einsteiger',normal:'mittel – ein paar falsche Fährten, man muss kombinieren',schwer:'schwer – viele falsche Fährten, Details genau lesen, Profis'};
function planPrompt(wish,min,lvl){const n=DUR[min]||5;
  return `Du bist Autorin von Krimi-Fallakten zum Selbstermitteln. 2–6 Spieler arbeiten gemeinsam eine digitale Fallakte am Fernseher durch und lösen den Fall. Spieldauer ca. ${min} Minuten, Schwierigkeit: ${LEVEL[lvl]||LEVEL.normal}.
Wunsch der Spieler: „${wish}“

Entwirf einen ORIGINELLEN, logisch wasserdichten Kriminalfall auf Deutsch:
- Schauplatz passend zum Wunsch, mit echten Orten (korrekte Koordinaten) und glaubwürdigen Details vor Ort.
- 4 bis 5 Verdächtige (verdaechtig:true) mit nachvollziehbarem Motiv und Alibi; genau einer ist schuldig. Dazu 1–2 Zeugen (verdaechtig:false). Keine echten, lebenden Prominenten.
- Fair Play: Alles zur Lösung steckt in den Beweisen. Der Täter wird erst durch die KOMBINATION mehrerer Beweise aus verschiedenen Kapiteln überführt (z. B. widerlegtes Alibi + Motiv + Spur). Mindestens zwei falsche Fährten, die sich auflösen lassen.
- Genau 3 Kapitel mit je ${n} Beweisen. Jedes Kapitel endet mit einem Ermittlungsauftrag, dessen Antwort sich eindeutig aus den bis dahin freigeschalteten Beweisen ableiten lässt (nicht wörtlich in einem einzigen Beweis steht). Auftragstypen: "person" (Antwort ist eine Personen-ID), "auswahl" (genau 4 Optionen, Antwort ist eine davon), "code" (Zahl oder kurzes Wort, max. 12 Zeichen, z. B. PIN, Uhrzeit wie 23:40, Kennzeichen – entsteht durch Kombinieren). Nach Kapitel 3 folgt die Anklage (Täter, Motiv, Methode, entscheidender Beweis) – die Kapitelaufträge fragen deshalb noch NICHT direkt nach dem Täter.
- Beweistypen: protokoll (Vernehmung), chat, email, brief, notiz (handschriftlich), zeitung, liste (Tabelle: Anrufliste, Kontoauszug, Kassenbon, Dienstplan, Fahrtenbuch …), bericht (Obduktion, Spurensicherung, Gutachten), foto, audio (Notruf, Mailbox, Mitschnitt – höchstens 2 Sprecher), karte (Lageplan), webseite (Firmenseite, Social-Media-Profil, Bewertungsportal, Blog, Online-Shop, Vereinsseite – gern mit verräterischen Kommentaren oder Zeitstempeln). raetsel (verschlossener Gegenstand: Tresor, gesperrtes Handy, Zahlenschloss, Laptop-Passwort, verschlüsselte Notiz – der Code lässt sich nur durch Kombinieren anderer Beweise herausfinden, z. B. Geburtsdatum aus dem Bericht + Hinweis im Chat; dahinter liegt ein Bonus-Beweis mit einer wichtigen Spur). Je Kapitel genau 1 foto, genau 1 audio und genau 1 raetsel, im ganzen Fall genau 1 karte und 2–3 webseite (verschiedene layouts), sonst bunt gemischt. Ein raetsel darf auch ein passwortgeschützter Login einer Fake-Webseite sein (art "Login", Feld "url", belohnung vom typ webseite). Beim raetsel beschreibt "inhalt" den Gegenstand, die richtige Antwort, wie man sie herleitet und was dahinter steckt.
- "inhalt" beschreibt knapp, was im Beweis steht und welche Spur/falsche Fährte er enthält (für die Autorin der Kapitel, nicht für die Spieler).
- "hinweise": 3 gestufte Tipps je Auftrag (sanft → deutlich → fast die Lösung), die auf konkrete Beweise verweisen.
- "ermittler": die leitende Kommissarin/der Kommissar, die/der den Spielern die Aufträge gibt.

Antworte ausschließlich mit JSON in genau dieser Form:
{"titel":"…","ort":"Ort, Region","datum":"Wochentag, TT. Monat JJJJ","einleitung":"Einsatzbefehl an die Spieler, 4–6 Sätze, spannend, ohne Lösung","ermittler":{"name":"…","geschlecht":"w"},
"opfer":{"name":"…","alter":54,"beschreibung":"…"},
"personen":[{"id":"p1","name":"…","alter":40,"geschlecht":"w","rolle":"Ehefrau des Opfers","beschreibung":"1–2 Sätze, was die Spieler über die Person wissen","verdaechtig":true,"motiv":"geheim","alibi":"geheim"}],
"kapitel":[{"titel":"…","beweise":[{"id":"e1","typ":"bericht","titel":"…","inhalt":"…"}],"auftrag":{"frage":"…","typ":"auswahl","optionen":["…","…","…","…"],"antwort":"…","hinweise":["…","…","…"],"erklaerung":"Warum das stimmt, 1–2 Sätze"}}],
"loesung":{"taeter":"p3","motiv":"…","methode":"…","beweise":["e4","e9","e13"],"ablauf":"Vollständige Auflösung als Erzählung der Kommissarin, 8–12 Sätze"},
"anklage":{"motive":["…","…","…","…"],"motiv":0,"methoden":["…","…","…","…"],"methode":0}}
Beweis-IDs fortlaufend e1, e2, … über alle Kapitel. In "anklage" ist "motiv"/"methode" der Index der richtigen Option.`}
function chapterPrompt(plan,k,prev){const ch=plan.kapitel[k],a=ch.auftrag;
  return `Du schreibst die Beweisstücke für eine Krimi-Fallakte. Hier ist der vollständige, geheime Fallplan:
${JSON.stringify({...plan,kapitel:plan.kapitel.map((c,i)=>i===k?c:{titel:c.titel,beweise:c.beweise.map(b=>({id:b.id,typ:b.typ,titel:b.titel,inhalt:b.inhalt}))})})}
${prev?`\nBereits geschriebene Beweise der früheren Kapitel (bleib dazu konsistent – Namen, Uhrzeiten, Orte, Fakten):\n${prev}\n`:''}
Schreibe jetzt VOLLSTÄNDIG die Beweise von Kapitel ${k+1} „${ch.titel}“: ${ch.beweise.map(b=>`${b.id} (${b.typ}) „${b.titel}“`).join(', ')}.
Am Ende des Kapitels lautet der Auftrag: „${a.frage}“ – richtige Antwort: ${a.typ==='person'?((plan.personen.find(p=>p.id===a.antwort)||{}).name||a.antwort):a.antwort}. Die Beweise dieses und der früheren Kapitel müssen die Antwort eindeutig herleitbar machen, ohne sie direkt zu verraten.
Schreib wie echte Akten: realistisch, konkrete Namen, Uhrzeiten, Adressen, Beträge – und auch belangloses Füllmaterial, damit man suchen muss. Verrate nie die Gesamtlösung.
Felder je Typ (zusätzlich immer "id","typ","titel","untertitel" (Aktenzeichen/Absender/Quelle) und "datum"):
- protokoll: "zeilen":[{"s":"Name oder 'Kommissarin'","t":"…"}] (12–20 Wortwechsel)
- chat: "teilnehmer":["A","B"],"ich":"A","nachrichten":[{"von":"A","zeit":"21:14","t":"…"}] (8–16)
- email: "von","an","betreff","text"
- brief / notiz: "text", optional "unterschrift"
- zeitung: "zeitung","ueberschrift","text"
- webseite (erfundene Fake-Webseite, wirkt echt): "layout" – eine von: "firma" (Firmen-/Hotel-/Vereinsseite), "blog", "shop", "news", "bewertung" (Bewertungsportal), "social" (Social-Media-Profil), "forum" (Forum-Thread), "suche" (Suchverlauf/Suchergebnisse aus dem Browser einer Person). Immer: "url" (erfunden, z. B. www.hotel-dunas-mar.es/team),"seite" (Name der Seite/Plattform, erfunden – keine echten Marken),"ueberschrift".
  · firma/blog/shop/news/bewertung: "abschnitte":[{"titel":"…","text":"…"}] (2–4),"kommentare":[{"von":"…","zeit":"…","t":"…","sterne":0-5}] (0–5, sterne nur bei bewertung)
  · social: "profil":{"name":"…","handle":"@…","bio":"…","ort":"…","follower":1234},"beitraege":[{"zeit":"…","t":"…","likes":12,"ort":"optional"}] (3–6),"kommentare" (0–5)
  · forum: "beitraege":[{"von":"Nutzername","zeit":"…","t":"…"}] (4–8)
  · suche: "treffer":[{"zeit":"21:43","suchanfrage":"…","titel":"…","url":"…","t":"Vorschautext"}] (5–10, chronologisch – verrät, wonach jemand gesucht hat)
- liste: "spalten":["…"],"zeilen":[["…"]] (6–14 Zeilen),"text" optional
- bericht: "felder":[{"k":"…","v":"…"}],"text"
- foto: Das Bild ist ein ECHTES, frei lizenziertes Foto von Wikimedia Commons, das nur den Ort bzw. einen typischen Gegenstand zeigt – KEINE Spuren. "suche": 2–4 ENGLISCHE Suchbegriffe, möglichst mit dem echten Ortsnamen (z. B. "Schloss Solitude Stuttgart", "Maspalomas dunes", "Stuttgart Schlossplatz night"; Gegenstände nur allgemein wie "espresso cup"; keine Personen), "bildtext": 1 Satz auf Deutsch, was das Foto allgemein zeigt (Ort/Ansicht, OHNE Spurendetails), "text": Vermerk der Spurensicherung (1–3 Sätze: welche Spuren dort gefunden wurden, inkl. aller Details, die man zum Lösen braucht)
- audio: "art" (z. B. Notruf, Mailbox, Mitschnitt),"stil": Regieanweisung für die Sprecher (z. B. "aufgeregt, flüsternd"),"sprecher":[{"name":"…","geschlecht":"w"}] (1–2),"zeilen":[{"s":"Name","t":"…"}] (insgesamt höchstens 130 Wörter)
- karte: "orte":[{"name":"…","lat":27.75,"lon":-15.57,"notiz":"…"}] (4–8 echte Orte mit korrekten Koordinaten)
- raetsel: "art" (Tresor, Handy, Zahlenschloss, Laptop, Geheimschrift …),"text" (2–4 Sätze: was die Ermittler vor sich haben – z. B. Tastenfeld, eingeritzte Symbole, ein Zettel daneben; ohne die Lösung zu verraten),"frage" (was eingegeben werden muss, z. B. "4-stellige PIN"),"antwort" (max. 12 Zeichen, eindeutig – herleitbar NUR durch Kombinieren von Beweisen dieses oder früherer Kapitel),"hinweis" (1 Tipp, der auf die richtigen Beweise zeigt),"url" (nur bei art "Login"),"belohnung": vollständiger Bonus-Beweis, der nach dem Öffnen erscheint, mit "typ" (notiz, brief, email, chat, liste, bericht oder webseite), "titel" und den Feldern dieses Typs
Texte 80–220 Wörter. Antworte ausschließlich mit JSON: {"beweise":[…]}`}

const GEN={busy:false,steps:[],chars:0,err:'',errAt:0,epoch:0,ctl:null};const ABORT=new Error('abgebrochen');
let C=null;               // der Fall (Plan + geschriebene Kapitel), nur am Fernseher
const IMG={},AUD={};      // Objekt-URLs der Fotos/Tonaufnahmen
function genTick(){if(MODE==='tv'){clearTimeout(genTick.t);genTick.t=setTimeout(()=>{renderTV();pushAll()},400)}}
function step(id,label,state,extra){GEN.chars=0;const s=GEN.steps.find(x=>x.id===id);if(s)Object.assign(s,{label,state,extra});else GEN.steps.push({id,label,state,extra});genTick()}

// Häufige KI-Ungenauigkeit: Name statt ID beim Täter oder bei Personen-Aufträgen
function prePlan(p){if(!p||!Array.isArray(p.personen))return p;
  const byName=v=>{const n=norm(v);const f=p.personen.find(x=>x&&(x.id===v||norm(x.name)===n||norm(x.name).includes(n)&&n.length>3));return f?f.id:v};
  if(p.loesung)p.loesung.taeter=byName(p.loesung.taeter);
  (p.kapitel||[]).forEach(c=>{if(c&&c.auftrag&&c.auftrag.typ==='person')c.auftrag.antwort=byName(c.auftrag.antwort)});return p}
function checkPlan(p){
  if(!p||typeof p!=='object')return 'leer';p=prePlan(p);
  if(!Array.isArray(p.personen)||p.personen.length<3)return 'zu wenige Personen';
  const ids=new Set(p.personen.map(x=>x&&x.id));
  if(!p.loesung||!ids.has(p.loesung.taeter))return 'Täter fehlt';
  if(!Array.isArray(p.kapitel)||p.kapitel.length<2)return 'zu wenige Kapitel';
  for(const c of p.kapitel){if(!c||!Array.isArray(c.beweise)||c.beweise.length<2)return 'Kapitel ohne Beweise';
    const a=c.auftrag;if(!a||!a.frage||a.antwort==null)return 'Auftrag fehlt';
    if(a.typ==='person'&&!ids.has(a.antwort))return 'Auftrag: unbekannte Person';
    if(a.typ==='auswahl'&&(!Array.isArray(a.optionen)||a.optionen.length<2))return 'Auftrag ohne Optionen'}
  const an=p.anklage;if(!an||!Array.isArray(an.motive)||!Array.isArray(an.methoden))return 'Anklage fehlt';
  return ''}
function fixPlan(p){
  p.titel=String(p.titel||'Ein rätselhafter Fall').slice(0,80);p.ort=String(p.ort||'').slice(0,80);p.datum=String(p.datum||'').slice(0,60);
  p.ermittler=p.ermittler&&p.ermittler.name?p.ermittler:{name:'Kommissarin Weber',geschlecht:'w'};
  p.personen=p.personen.filter(x=>x&&x.id&&x.name).slice(0,8).map(x=>({...x,geschlecht:/^(w|f)/i.test(x.geschlecht||'')?'w':'m',verdaechtig:x.verdaechtig!==false}));
  let n=0;p.kapitel=p.kapitel.slice(0,4).map(c=>({...c,titel:String(c.titel||'').replace(/^\s*Kapitel\s*\d+\s*[:.·–-]\s*/i,'').slice(0,60)||'Kapitel',beweise:c.beweise.filter(b=>b&&b.id).map(b=>({...b,typ:ICON[b.typ]?b.typ:'notiz'})),
    auftrag:{...c.auftrag,typ:['person','auswahl','code'].includes(c.auftrag.typ)?c.auftrag.typ:'code',hinweise:(Array.isArray(c.auftrag.hinweise)?c.auftrag.hinweise:[]).slice(0,3).map(String)}}));
  p.kapitel.forEach(c=>{const a=c.auftrag;if(a.typ==='auswahl'){a.optionen=a.optionen.map(String).slice(0,5);if(typeof a.antwort==='number')a.antwort=a.optionen[a.antwort];
    if(!a.optionen.some(o=>norm(o)===norm(a.antwort)))a.optionen[a.optionen.length-1]=String(a.antwort);a.optionen=shuffle(a.optionen)}});
  const an=p.anklage;an.motive=an.motive.map(String).slice(0,4);an.methoden=an.methoden.map(String).slice(0,4);
  an.motiv=Math.max(0,Math.min(an.motive.length-1,+an.motiv||0));an.methode=Math.max(0,Math.min(an.methoden.length-1,+an.methode||0));
  // Reihenfolge mischen, damit die richtige Antwort nicht immer vorne steht
  const mix=(arr,i)=>{const r=arr[i],s=shuffle(arr);return [s,s.indexOf(r)]};[an.motive,an.motiv]=mix(an.motive,an.motiv);[an.methoden,an.methode]=mix(an.methoden,an.methode);
  p.loesung.beweise=(Array.isArray(p.loesung.beweise)?p.loesung.beweise:[]).map(String);
  return p}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const evById=id=>{if(!C)return null;for(const c of C.kapitel)for(const b of c.beweise)if(b.id===id)return b;return null};
const evText=b=>[b.titel,b.untertitel,b.datum,b.text,b.von,b.an,b.betreff,b.ueberschrift,b.unterschrift,
  ...(b.zeilen||[]).map(z=>Array.isArray(z)?z.join(' '):`${z.s}: ${z.t}`),...(b.nachrichten||[]).map(m=>`${m.von} ${m.zeit}: ${m.t}`),
  ...(b.felder||[]).map(f=>`${f.k}: ${f.v}`),b.url,b.seite,...(b.abschnitte||[]).map(a=>`${a.titel}: ${a.text}`),b.profil?`${b.profil.name} ${b.profil.handle}: ${b.profil.bio}`:'',...(b.beitraege||[]).map(x=>`${x.von||''} ${x.zeit}: ${x.t}`),...(b.treffer||[]).map(x=>`${x.zeit} „${x.suchanfrage}“ → ${x.titel}`),...(b.kommentare||[]).map(k=>`${k.von} ${k.zeit}: ${k.t}`),...(b.orte||[]).map(o=>`${o.name}: ${o.notiz||''}`),b.frage,b.antwort?'Lösung: '+b.antwort:'',b.belohnung?'Inhalt: '+evText(b.belohnung):''].filter(Boolean).join('\n');

async function saveCase(){if(C)await DB.set('case',C)}
async function saveProg(){await DB.set('prog',{...K,toast:null,playing:null})}
async function generate(){
  if(GEN.busy||!C)return;GEN.busy=true;GEN.err='';const ep=GEN.epoch,chk=()=>{if(ep!==GEN.epoch)throw ABORT};
  try{
    if(!C.plan){
      step('plan','Fallplan wird entworfen','now');
      let p,why='';
      for(let a=0;a<3;a++){p=await askJSON(planPrompt(C.wish,C.min,C.level),{think:true,tries:3});chk();why=checkPlan(p);if(!why)break;step('plan',`Fallplan unvollständig (${why}) – neuer Versuch`,'now')}
      if(why)throw new Error('Fallplan unbrauchbar: '+why);
      Object.assign(C,fixPlan(p));C.plan=true;
      C.kapitel.forEach((c,i)=>{c.written=false;c.ready=false});(chk(),await saveCase());
      step('plan',`Fallplan: „${C.titel}“`,'ok');K.marks=Object.fromEntries(C.personen.filter(p=>p.verdaechtig).map(p=>[p.id,'q']));(chk(),saveProg())}
    // Einsatzbefehl als Ansage der Kommissarin
    if(!C.briefAud){step('brief','Einsatzbefehl wird eingesprochen','now');
      try{AUD.brief=URL.createObjectURL(await genAudioStore('aud:brief',[{s:C.ermittler.name,t:C.einleitung}],{[C.ermittler.name]:{g:C.ermittler.geschlecht}},'ernst, ruhig, wie eine Kommissarin beim Einsatzbefehl'));C.briefAud=true;step('brief','Einsatzbefehl eingesprochen','ok')}
      catch(e){chk();C.briefAud='x';step('brief','Einsatzbefehl nur als Text ('+shortErr(e)+')','bad')}
      (chk(),await saveCase())}
    for(let k=0;k<C.kapitel.length;k++){const ch=C.kapitel[k];
      if(!ch.written){step('k'+k,`Kapitel ${k+1}: Beweise werden geschrieben`,'now');
        const prev=C.kapitel.slice(0,k).flatMap(c=>c.beweise).map(b=>`[${b.id}] ${evText(b)}`).join('\n\n').slice(0,24000);
        let got=null;
        for(let a=0;a<2&&!got;a++){const r=await askJSON(chapterPrompt(C,k,prev),{tries:3});chk();const list=r&&Array.isArray(r.beweise)?r.beweise:Array.isArray(r)?r:[];
          if(list.length>=Math.min(2,ch.beweise.length))got=list}
        if(!got)throw new Error(`Kapitel ${k+1} kam leer zurück`);
        ch.beweise=ch.beweise.map(b=>{const w=got.find(x=>x&&x.id===b.id)||got[ch.beweise.indexOf(b)]||{};
          return cleanEv({...w,id:b.id,typ:ICON[w.typ]?w.typ:b.typ,titel:w.titel||b.titel,ch:k,plan:b.inhalt})});
        ch.written=true;(chk(),await saveCase());step('k'+k,`Kapitel ${k+1}: ${ch.beweise.length} Beweise geschrieben`,'ok')}
      // Fotos und Tonaufnahmen dieses Kapitels
      for(const b of ch.beweise){
        if(b.typ==='foto'&&!b.media){step('m'+b.id,`Foto „${b.titel}“`,'now');
          try{const bl=await findPhoto(b);await DB.set('img:'+b.id,bl);IMG[b.id]=URL.createObjectURL(bl);b.media='ok';step('m'+b.id,`Foto „${b.titel}“`,'ok')}
          catch(e){chk();b.media='x';b.mediaErr=shortErr(e);step('m'+b.id,`Foto „${b.titel}“ nur als Beschreibung (${shortErr(e)})`,'bad')}
          (chk(),await saveCase())}
        if(b.typ==='audio'&&!b.media){step('m'+b.id,`Tonaufnahme „${b.titel}“`,'now');
          const people={};(b.sprecher||[]).forEach(s=>people[s.name]={g:s.geschlecht});
          try{AUD[b.id]=URL.createObjectURL(await genAudioStore('aud:'+b.id,b.zeilen,people,b.stil));b.media='ok';step('m'+b.id,`Tonaufnahme „${b.titel}“`,'ok')}
          catch(e){chk();b.media='x';b.mediaErr=shortErr(e);step('m'+b.id,`Tonaufnahme „${b.titel}“ nur als Abschrift (${shortErr(e)})`,'bad')}
          (chk(),await saveCase())}}
      ch.ready=true;(chk(),await saveCase());
      if(k===0&&K.phase==='gen'){K.phase='ready';(chk(),saveProg())}
      if(K.waiting&&K.ch===k){K.waiting=false;unlockChapter(k)}
      pushAll();renderTV()}
  }catch(e){if(ep!==GEN.epoch)return;GEN.err=shortErr(e);GEN.errAt=now();step('err','Fehler: '+GEN.err,'bad')}
  finally{if(ep===GEN.epoch){GEN.busy=false;renderTV();pushAll()}}}
// Auflösung erst einsprechen, wenn wirklich angeklagt wurde (spart den Aufruf bei abgebrochenen Spielen)
let SOLBUSY=false;
async function solAudio(){
  if(SOLBUSY)return;
  if(!C.solAud){SOLBUSY=true;
    try{AUD.sol=URL.createObjectURL(await genAudioStore('aud:sol',[{s:C.ermittler.name,t:C.loesung.ablauf}],{[C.ermittler.name]:{g:C.ermittler.geschlecht}},'ruhig und erzählend, wie bei der Auflösung eines Falls'));C.solAud=true}
    catch(e){C.solAud='x'}
    SOLBUSY=false;await saveCase()}
  if(C.solAud===true&&K.phase==='end')playAudio('sol')}
async function genAudioStore(key,lines,people,stil){
  lines=(lines||[]).filter(l=>l&&l.t).map(l=>({s:String(l.s||'Sprecher'),t:String(l.t)}));if(!lines.length)throw new Error('kein Text');
  const bl=await genAudio(lines,people,stil);await DB.set(key,bl);return bl}
const shortErr=e=>String((e&&e.message)||e||'Fehler').replace(/\s+/g,' ').slice(0,110);
// Nur erlaubte Felder, alles als Text (die Anzeige escaped ohnehin)
function cleanEv(b){const s=v=>v==null?'':String(v).slice(0,4000),arr=v=>Array.isArray(v)?v:[];
  const o={id:b.id,typ:b.typ,ch:b.ch,titel:s(b.titel).slice(0,90),untertitel:s(b.untertitel).slice(0,120),datum:s(b.datum).slice(0,60),plan:b.plan};
  switch(b.typ){
    case 'protokoll':o.zeilen=arr(b.zeilen).filter(z=>z&&z.t).slice(0,40).map(z=>({s:s(z.s).slice(0,40),t:s(z.t)}));break;
    case 'chat':o.teilnehmer=arr(b.teilnehmer).map(s).slice(0,4);o.ich=s(b.ich);o.nachrichten=arr(b.nachrichten).filter(m=>m&&m.t).slice(0,40).map(m=>({von:s(m.von).slice(0,40),zeit:s(m.zeit).slice(0,20),t:s(m.t)}));break;
    case 'email':Object.assign(o,{von:s(b.von),an:s(b.an),betreff:s(b.betreff),text:s(b.text)});break;
    case 'brief':case 'notiz':Object.assign(o,{text:s(b.text),unterschrift:s(b.unterschrift)});break;
    case 'zeitung':Object.assign(o,{zeitung:s(b.zeitung),ueberschrift:s(b.ueberschrift),text:s(b.text)});break;
    case 'webseite':Object.assign(o,{layout:['firma','blog','shop','news','bewertung','social','forum','suche'].includes(b.layout)?b.layout:'firma',
      profil:b.profil&&typeof b.profil==='object'?{name:s(b.profil.name).slice(0,60),handle:s(b.profil.handle).slice(0,40),bio:s(b.profil.bio).slice(0,300),ort:s(b.profil.ort).slice(0,60),follower:Math.max(0,Math.round(+b.profil.follower||0))}:null,
      beitraege:arr(b.beitraege).filter(x=>x&&x.t).slice(0,10).map(x=>({von:s(x.von).slice(0,40),zeit:s(x.zeit).slice(0,30),t:s(x.t),likes:Math.max(0,Math.round(+x.likes||0)),ort:s(x.ort).slice(0,60)})),

const mX=lon=>(lon+180)/360,mY=lat=>{const t=Math.sin(Math.max(-85,Math.min(85,lat))*Math.PI/180);return .5-Math.log((1+t)/(1-t))/(4*Math.PI)};
function mapSVG(orte){const W=800,H=560;if(!orte.length)return '';
  const xs=orte.map(o=>mX(o.lon)),ys=orte.map(o=>mY(o.lat));let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const span=Math.max(x1-x0,(y1-y0)*W/H,2e-4)*1.35,cx=(x0+x1)/2,cy=(y0+y1)/2,sc=W/span;
  const z=Math.max(2,Math.min(17,Math.round(Math.log2(sc/256)))),n=2**z,ts=sc/n;let t='';
  const vx0=cx-W/2/sc,vx1=cx+W/2/sc,vy0=cy-H/2/sc,vy1=cy+H/2/sc;
  for(let ty=Math.floor(vy0*n);ty<=Math.floor(vy1*n);ty++){if(ty<0||ty>=n)continue;for(let tx=Math.floor(vx0*n);tx<=Math.floor(vx1*n);tx++){const wx=((tx%n)+n)%n;
    t+=`<image href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${ty}/${wx}" x="${(W/2+(tx/n-cx)*sc).toFixed(1)}" y="${(H/2+(ty/n-cy)*sc).toFixed(1)}" width="${(ts+.8).toFixed(1)}" height="${(ts+.8).toFixed(1)}"/>`}}
  const pins=orte.map((o,i)=>{const x=W/2+(mX(o.lon)-cx)*sc,y=H/2+(mY(o.lat)-cy)*sc;
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="15" fill="#d23c46" stroke="#fff" stroke-width="3"/><text y="6" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" font-family="Inter,sans-serif">${i+1}</text></g>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#1d3b5c"/>${t}${pins}<text x="${W-8}" y="${H-8}" text-anchor="end" font-size="12" fill="#fff" opacity=".8" font-family="Inter,sans-serif">Bilder © Esri</text></svg>`}

        <div class="body">${sub}${(b.beitraege||[]).map(x=>`<div class="post"><div class="ph">${esc(x.zeit)}${x.ort?' · 📍 '+esc(x.ort):''}</div>${P(x.t)}<div class="lk">♥ ${x.likes||0}</div></div>`).join('')}${coms}</div></div>`}

        ${open?`<div class="reward">🔓 Nach dem Login:</div>${docHTML(b.belohnung)}`:''}`;

        ${open?`<div class="reward">🔓 Darin gefunden:</div>${docHTML(b.belohnung)}`:''}`}
    case 'zeitung':return `<div class="doc zeitung"><div class="zt">${esc(b.zeitung||'Tageblatt')}</div><div class="sub">${esc(b.datum)}</div><h3>${esc(b.ueberschrift||b.titel)}</h3>${P(b.text)}</div>`;
    case 'liste':return `<div class="doc liste">${head}<table><tr>${(b.spalten||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${(b.zeilen||[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>${P(b.text)}</div>`;
    case 'bericht':return `<div class="doc bericht"><div class="stamp">VERTRAULICH</div>${head}<div class="kv">${(b.felder||[]).map(f=>`<b>${esc(f.k)}</b><span>${esc(f.v)}</span>`).join('')}</div>${P(b.text)}</div>`;
    case 'foto':return `<div class="doc foto">${img?`<img src="${img}" alt="">`:`<div class="ph">${b.media==='x'?'📷 Foto nicht verfügbar':'📷 Foto wird geladen …'}</div>`}<div class="cap">${esc(b.titel)}${b.bildtext?' – '+esc(b.bildtext):''}</div>${b.credit&&img?`<div class="cred">${esc(b.credit)}</div>`:''}${b.text?`<div class="vm"><b>📎 Vermerk der Spurensicherung</b>${esc(b.text)}</div>`:''}</div>`;

      ${heard?(b.zeilen||[]).map(z=>`<div class="line"><b>${esc(z.s)}:</b> ${esc(z.t)}</div>`).join(''):`<div class="lock">${b.media==='x'?'':'🎧 Abschrift erscheint, sobald die Aufnahme einmal am Fernseher lief.'}</div>`}
      ${b.media==='x'?`<div class="lock" style="color:var(--mute)">(Tonaufnahme nicht verfügbar – hier die Abschrift)</div>`:''}</div>`;

/* =====================================================================
   SPIELSTAND (Fernseher)
   ===================================================================== */
let K={phase:'lobby',wish:'',min:60,level:'normal',ch:0,unlocked:[],heard:[],hints:{},wrong:{},solved:[],shown:null,scrollAt:0,marks:{},
  elapsed:0,runAt:0,waiting:false,toast:null,result:null,seenBy:{},cracked:[],rhints:{},rwrong:{}};
const P=[];                // Spieler {id,name,color,joined,cid}
let hostId=null;const BOOT=Date.now();
// Spielleiter weg (Handy aus / Verbindung verloren)? Dann übernimmt der nächste aktive Spieler – nach dem TV-Start erst nach 20 s, damit sich alle wieder verbinden können
// Handys melden sich alle 5 s (Lebenszeichen). Wer 30 s still ist, gilt als offline und verschwindet aus der Spielerliste.
const OFF_MS=30000,online=p=>!!(p&&p.joined&&Date.now()-(p.seen||0)<OFF_MS),onlineP=()=>P.filter(online);
// Spielleiter seit 60 s offline? Dann übernimmt der nächste aktive Spieler (nach dem TV-Start erst nach 60 s)
const hostGone=()=>hostId==null||!P[hostId]||!P[hostId].joined||(Date.now()-(P[hostId].seen||0)>60000&&Date.now()-BOOT>60000);
const host=()=>P.find(p=>p.id===hostId);
const elapsed=()=>K.elapsed+(K.runAt?now()-K.runAt:0);
function toast(t){K.toast={t,at:now()};renderTV();setTimeout(()=>{if(K.toast&&now()-K.toast.at>=3900){K.toast=null;renderTV()}},4000)}
function unlockChapter(k){const ch=C.kapitel[k];if(!ch.ready){K.waiting=true;return}
  ch.beweise.forEach(b=>{if(!K.unlocked.includes(b.id))K.unlocked.push(b.id)});K.ch=k;K.waiting=false;saveProg()}
function startClock(){if(!K.runAt)K.runAt=now()}
function score(){let s=100;Object.values(K.hints).forEach(n=>s-=5*n);Object.values(K.wrong).forEach(n=>s-=10*n);
  s-=5*Object.keys(K.rhints||{}).length;Object.values(K.rwrong||{}).forEach(n=>s-=2*n);
  if(K.result){const r=K.result;if(!r.taeter)return 0;if(!r.motiv)s-=10;if(!r.methode)s-=10;if(!r.beweis)s-=10}return Math.max(0,s)}
const curTask=()=>C&&C.kapitel[K.ch]&&C.kapitel[K.ch].auftrag;
function checkAnswer(a,v){const want=a.typ==='person'?a.antwort:String(a.antwort);
  if(a.typ==='person')return v===want;
  if(a.typ==='auswahl')return norm(v)===norm(want);
  const n=norm(v),w=norm(want);if(n===w)return true;
  // Uhrzeit/Zahlen: nur die Ziffern vergleichen (23:40 = 2340), Wörter auch ohne Artikel
  const tm=x=>{const m=String(x).match(/(\d{1,2})\s*[:.h]\s*(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
  if(/^\s*\d{1,2}\s*[:.]\s*\d{2}\s*(uhr)?\s*$/i.test(String(want))){const a1=tm(want),b1=tm(v)??(/^\d{3,4}$/.test(String(v).replace(/\D/g,''))?tm(String(v).replace(/\D/g,'').padStart(4,'0').replace(/(\d\d)(\d\d)/,'$1:$2')):null);return a1!=null&&a1===b1}
  const d=s=>String(s).replace(/\D/g,'').replace(/^0+(?=\d)/,'');if(/^[\d\s:.,\-/]+$/.test(String(want).trim())&&d(want).length>=2)return d(v)===d(want);
  return w.length>3&&n.length>=w.length-1&&(n.endsWith(w)||w.endsWith(n))}

/* ---------- Nachrichten der Handys ---------- */
function handle(pid,m){
  const p=P[pid];if(!p)return;
  if(p.joined&&pid!==hostId&&hostGone()){hostId=pid;savePlayers();pushAll()}
  const isHost=pid===hostId;
  switch(m.type){
    case 'join':{const name=String(m.name||'').trim().slice(0,16);if(!name)return;
      p.name=name;if(!p.joined){p.joined=true;p.color=COLORS[P.filter(x=>x.joined).length-1]||COLORS[pid%COLORS.length]}
      if(hostGone())hostId=pid;break}
    case 'wish':if(!isHost||!['lobby','ready'].includes(K.phase)&&K.phase!=='gen')return;K.wish=String(m.v||'').slice(0,200);try{localStorage.setItem('ck_wish',K.wish)}catch(e){}break;
    case 'opts':if(!isHost||K.phase!=='lobby')return;if(DUR[m.min])K.min=m.min;if(LEVEL[m.level])K.level=m.level;break;
    case 'gemSet':if(!isHost||typeof m.key!=='string'||m.key.length>200)return;setKey(m.key.trim());break;
    case 'create':if(!isHost||K.phase!=='lobby'||!GEM.key||!K.wish.trim())return;newCase();break;
    case 'retry':if(!isHost||GEN.busy||!C)return;GEN.steps=GEN.steps.filter(s=>s.id!=='err');generate();break;
    case 'discard':if(!isHost)return;discardCase();break;
    case 'begin':if(!isHost||K.phase!=='ready')return;K.phase='briefing';unlockChapter(0);playAudio('brief');saveProg();break;
    case 'toFile':if(!isHost||K.phase!=='briefing')return;K.phase='play';stopAudio();startClock();saveProg();break;
    case 'show':{if(!['play','briefing','accuse'].includes(K.phase)||!K.unlocked.includes(m.id))return;
      if(K.phase==='briefing'){K.phase='play';stopAudio();startClock()}
      K.shown=m.id;K.scrollAt=0;const b=evById(m.id);toast(`${p.name} zeigt: ${b?b.titel:''}`);break}
    case 'hideShown':K.shown=null;break;
    case 'scroll':{const v=$('#vscroll');if(v)v.scrollBy(0,(m.d>0?1:-1)*v.clientHeight*.7);return}
    case 'play':{if(!K.unlocked.includes(m.id)&&m.id!=='brief'&&m.id!=='sol')return;
      if(K.phase==='briefing'&&m.id!=='brief'){K.phase='play';startClock()}
      if(m.id!=='brief'&&m.id!=='sol')K.shown=m.id;playAudio(m.id);break}
    case 'stop':stopAudio();break;
    case 'mark':if(!C||!K.marks.hasOwnProperty(m.id)||!MARKS[m.v])return;K.marks[m.id]=m.v;saveProg();break;
    case 'hint':{if(K.phase!=='play'||K.waiting)return;const a=curTask();if(!a)return;const n=K.hints[K.ch]||0;if(n>=a.hinweise.length)return;
      K.hints[K.ch]=n+1;toast(`💡 ${p.name} hat einen Tipp genommen`);saveProg();break}
    case 'answer':{if(K.phase!=='play'||K.waiting)return;const a=curTask();if(!a)return;
      if(checkAnswer(a,m.v)){K.solved.push(K.ch);const last=K.ch>=C.kapitel.length-1;
        K.flash={ok:true,t:a.erklaerung||'',by:p.name,at:now(),next:last?'Zeit für die Anklage!':`Kapitel ${K.ch+2}: „${C.kapitel[K.ch+1].titel}“`};
        if(last){K.phase='accuse'}else unlockChapter(K.ch+1);
        K.newFrom=K.unlocked.length}
      else{K.wrong[K.ch]=(K.wrong[K.ch]||0)+1;K.flash={ok:false,by:p.name,at:now(),v:String(m.v).slice(0,40)}}
      saveProg();setTimeout(()=>{if(K.flash&&now()-K.flash.at>=5900){K.flash=null;renderTV();pushAll()}},6000);break}
    case 'accuse':{if(K.phase!=='accuse')return;const an=C.anklage;
      K.result={taeter:m.taeter===C.loesung.taeter,motiv:+m.motiv===an.motiv,methode:+m.methode===an.methode,beweis:C.loesung.beweise.includes(m.beweis),
        pick:{taeter:m.taeter,motiv:+m.motiv,methode:+m.methode,beweis:m.beweis},by:p.name};
      K.elapsed=elapsed();K.runAt=0;K.phase='end';K.score=score();saveProg();setTimeout(solAudio,2500);break}
    case 'newGame':if(!isHost||K.phase!=='end')return;discardCase();break;
    // Jeder Mitspieler kann die Spielleitung übernehmen (z. B. wenn das Spielleiter-Handy aus ist)
    case 'crack':{if(!['play','accuse'].includes(K.phase))return;const b=evById(m.id);
      if(!b||b.typ!=='raetsel'||!K.unlocked.includes(b.id)||K.cracked.includes(b.id))return;const v=String(m.v||'').slice(0,40);
      if(checkAnswer({typ:'code',antwort:b.antwort},v)){K.cracked.push(b.id);K.shown=b.id;K.scrollAt=now();toast(`🔓 ${p.name} hat „${b.titel}“ geöffnet!`)}
      else{K.rwrong[b.id]=(K.rwrong[b.id]||0)+1;toast(`🔒 „${v}“ passt nicht (−2 Punkte)`)}
      saveProg();break}
    case 'rhint':{const b=evById(m.id);if(!b||b.typ!=='raetsel'||!K.unlocked.includes(b.id)||K.rhints[b.id]||K.cracked.includes(b.id))return;K.rhints[b.id]=1;saveProg();break}
    case 'claimHost':if(!p.joined||isHost)return;hostId=pid;savePlayers();toast(`👑 ${p.name} ist jetzt Spielleiter`);break;
    case 'getEv':{const b=evById(m.id);if(!b||!K.unlocked.includes(m.id))return;
      tell(pid,{t:'ev',ev:pubEv(b)});if(b.typ==='foto'&&IMG[b.id])sendImg(pid,b.id);return}
    default:return}
  renderTV();pushAll()}

function hostNet(){
  const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  if(!ROOM){try{const r=JSON.parse(localStorage.getItem('ck_room')||'null');if(r&&now()-r.at<6*3600e3)ROOM=r.code}catch(e){}}
  if(!ROOM)ROOM=Array.from({length:4},()=>ABC[Math.floor(Math.random()*ABC.length)]).join('');
  try{localStorage.setItem('ck_room',JSON.stringify({code:ROOM,at:now()}))}catch(e){}
  const peer=NET.peer=new Peer(peerId(ROOM));
  peer.on('open',()=>{NET.everOpen=true;renderTV()});
  if(!hostNet.watch){hostNet.watch=setInterval(()=>{const sig=onlineP().map(p=>p.id).join(',');if(sig!==hostNet.sig){hostNet.sig=sig;renderTV();pushAll()}},5000)}
  peer.on('connection',conn=>{
    conn.on('data',d=>{if(!d||typeof d!=='object')return;
      {const q=P[conn.pid];if(q&&NET.conns[conn.pid]===conn){const back=q.joined&&!online(q);q.seen=Date.now();if(back){renderTV();pushAll()}}}
      if(d.t==='hb')return;
      if(d.t==='hello'&&typeof d.cid==='string'){let pid=NET.cids[d.cid];
        if(pid==null){pid=P.length;if(pid>=6){try{conn.send({t:'full'})}catch(e){}return}P.push({id:pid,name:'',joined:false,color:COLORS[pid]});NET.cids[d.cid]=pid}
        const old=NET.conns[pid];NET.conns[pid]=conn;conn.pid=pid;P[pid].seen=Date.now();if(old&&old!==conn){try{old.close()}catch(e){}}
        tell(pid,{t:'welcome',pid,room:ROOM});tell(pid,{t:'state',s:pubState(pid)});savePlayers()}
      else if(d.t==='msg'&&conn.pid!=null&&NET.conns[conn.pid]===conn&&d.m&&typeof d.m.type==='string'){handle(conn.pid,d.m);if(d.m.type==='join')savePlayers()}});
    conn.on('close',()=>{if(NET.conns[conn.pid]===conn)delete NET.conns[conn.pid]});conn.on('error',()=>{})});
  peer.on('error',e=>{if(e.type==='unavailable-id'&&!NET.everOpen){ROOM='';try{localStorage.removeItem('ck_room')}catch(x){}setTimeout(()=>{try{peer.destroy()}catch(x){}hostNet()},500)}})}
